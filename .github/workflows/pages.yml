---
# Builds the training site, publishes it to the host that serves it, and keeps
# the address it used to have answering.
#
# The course is served from sfdx-hardis-training/sfdx-hardis-training.github.io.
# This workflow force-pushes the built site there, to a gh-pages branch, over a
# deploy key. That repository is an organization site, so it serves at the root
# of its host rather than under a repository name, which is the base path the
# custom domain answers on: the copy published there already has the URLs it
# keeps.
#
# This repository's own Pages setting stays **Source: GitHub Actions**, and the
# artifact uploaded at the end of the build is what its URL serves. That is still
# the course itself. It becomes the redirect site, built here on every run, the
# day the custom domain answers.
name: Build and publish the training site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

# One deployment at a time, and never cancel one half way through
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build with Zensical
    # The site of this course is published from this repository only. A learner's
    # fork has no Pages site, so the deploy job below fails there, on every push
    # to main, with a red cross they cannot do anything about and that says
    # nothing about their work.
    if: github.repository == 'hardisgroupcom/sfdx-hardis-training'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # Everything the site publishes is generated from training-universe.json and
      # the lab front matter, so a drifted artifact fails here rather than reaching
      # a learner.
      - name: Regenerate the derived files
        run: |
          node scripts/build/universe.mjs --check
          node scripts/build/lab-crossrefs.mjs --check
          node scripts/build/lab-command-links.mjs --check
          node scripts/build/site.mjs

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.x

      # Zensical is the successor of mkdocs-material and reads the same configuration format.
      # The course site's is course-site.yml: mkdocs.yml belongs to the Helios project documentation
      - run: pip install zensical mdx_truly_sane_lists
      - run: python -m zensical build -f course-site.yml

      - name: Every page resolves every asset it references
        run: node scripts/verify/check-site.mjs

      # Each language reads as a course of its own: the menu of a page holds
      # that language and nothing else, the translate widget lands on the same
      # page in the other language, and the arrows stay inside one language.
      - name: Every language keeps to itself
        run: node scripts/verify/check-nav.mjs

      # A page opened with no hash must show its title. The comment widget is a
      # cross-origin frame at the bottom of a long page, and an eager one takes
      # the scroll position with it the moment it takes focus.
      - name: Every page opens at the top
        run: |
          npm install --no-save playwright-core
          npx playwright-core install --with-deps chrome
          node scripts/verify/check-scroll.mjs

      # The widget keeps the page only if a script rebuilds its links after an
      # instant navigation, and only a browser can say that it does.
      - name: The translate widget keeps the page
        run: node scripts/verify/check-language-switch.mjs

      # The host the course is served from. This runs before the Pages artifact
      # is uploaded on purpose: a failure here stops the old URL from publishing
      # redirects to a copy that was never updated.
      - name: Publish the site to sfdx-hardis-training.github.io
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          deploy_key: ${{ secrets.SFDX_HARDIS_TRAINING_GITHUB_IO_SSH_PRIVATE_KEY }}
          external_repository: sfdx-hardis-training/sfdx-hardis-training.github.io
          publish_branch: gh-pages
          publish_dir: ./site
          # A built site has no history worth keeping, and without this the branch
          # grows by a full copy of 50 MB of screenshots on every push.
          force_orphan: true
          commit_message: "Built from ${{ github.sha }}"

      # What the old URL serves once the custom domain answers: one redirect page
      # per page of the course, and the badge records copied as they are, because
      # nothing that fetches a badge record parses HTML. Built on every run, so it
      # always covers the page set that exists, and checked here even though the
      # artifact below is still the course itself.
      - name: Build the redirect site for the old URL
        run: |
          node scripts/build/redirect-site.mjs
          node scripts/build/redirect-site.mjs --check

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.repository == 'hardisgroupcom/sfdx-hardis-training'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
