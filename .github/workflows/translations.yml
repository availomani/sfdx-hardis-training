---
# What the translations need checking for, on the Pull Request that changes them.
#
# Two different things, and only one of them is a failure:
#
#   - a translation whose English source has moved is **reported**, never fatal.
#     English is the reference and a translation is allowed to lag: what the job
#     prints is the list of pages to re-read, not a reason to block a merge
#   - a table whose pipes no longer line up **fails**, because it is mechanical,
#     one command fixes it, and MegaLinter would fail on it anyway, later and
#     less clearly
name: Check the translations

on:
  push:
    branches: [main]
    paths:
      - "labs/**"
      - ".github/workflows/translations.yml"
  pull_request:
    paths:
      - "labs/**"
  workflow_dispatch:

permissions: read-all

jobs:
  translations:
    name: Staleness, alignment and shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          # source_rev names a commit, and comparing it with the history of the
          # English file needs that history
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Translations behind their English source
        run: node scripts/i18n/check-translations.mjs

      - name: Every table's pipes line up
        run: node scripts/i18n/align-tables.mjs --check

      # Reports, never fails: a deliberate difference is allowed, and the French
      # home page has one. It is here to be read on the Pull Request, because a
      # translation that lost an image or an "Under the hood" block shows up
      # nowhere else.
      - name: Translations keep the shape of their source
        run: node scripts/i18n/check-structure.mjs
