name: "Guinea Run: send my scores"
description: Put your Guinea Run scores in the Hall of Fame. The game fills this in for you.
title: "[Guinea Run] "
labels: ["guinea-run-score"]
body:
  - type: markdown
    attributes:
      value: |
        A job checks the scores below and adds them to the
        [Hall of Fame](https://sfdx-hardis-training.cloudity.com/hall-of-fame/), then answers
        on this issue with your ranks. Nobody reviews submissions by hand.

        Two things to know before you submit:

        - **Your GitHub handle, your avatar and your scores become public** in this repository,
          permanently. If that is not acceptable to you, do not submit.
        - **The game fills the field below. Do not edit it**: an edited submission is refused.

        Each world keeps your best score, so sending again later never lowers it.

  - type: textarea
    id: scores
    attributes:
      label: Scores
      description: Filled in by the game, from "Send my scores" in its Hall of Fame. Leave it as it is.
      render: json
    validations:
      required: true
