name: Claim a training badge
description: You finished a level and want the badge. A job checks your public repository and answers here.
title: "[Badge claim] Level "
labels: ["badge-claim"]
body:
  - type: markdown
    attributes:
      value: |
        A job clones the repository you name below, re-runs every check of the level you claim, and
        answers on this issue. Nobody reviews claims by hand, so it usually takes a couple of
        minutes.

        Two things to know before you submit:

        - **Your repository has to be public**, or the job cannot read it.
        - **Your GitHub handle and the badge page become public** in this repository, permanently.
          If that is not acceptable to you, do not claim.

        This is a badge, not a certification. There is no exam here.

  - type: dropdown
    id: level
    attributes:
      label: Level
      description: A level 2 claim also re-runs the level 1 audit, and a level 3 claim re-runs both.
      options:
        - "1 - Contributor basics"
        - "2 - Contributor advanced"
        - "3 - Release Manager"
    validations:
      required: true

  - type: input
    id: trailblazer
    attributes:
      label: Trailblazer username
      description: Shown on your badge page, and linked to your public profile. Not used to verify anything.
      placeholder: nvuillamy
    validations:
      required: true

  - type: input
    id: repository
    attributes:
      label: Public repository URL
      description: >-
        Where you did the training. It must be public and readable without signing in. A fork, a
        repository created from a template or a manual copy are all accepted: the audit reads the
        content, not the fork relationship.
      placeholder: https://github.com/your-handle/sfdx-hardis-training
    validations:
      required: true

  - type: textarea
    id: receipts
    attributes:
      label: Receipts
      description: >-
        The lines printed by Training > Check my work. They are your progress record, not the proof:
        the audit ignores them and reads your repository instead. Training > Claim my badge fills
        this in for you.
      placeholder: |
        LAB 1.2 OK  handle=jdupont  commit=7f3a91c  2026-09-15T14:22Z
        LAB 1.3 OK  handle=jdupont  commit=9c21ab4  2026-09-15T15:05Z
      render: text
    validations:
      required: false

  - type: checkboxes
    id: understood
    attributes:
      label: Before you submit
      options:
        - label: My repository is public.
          required: true
        - label: I understand my GitHub handle will appear publicly in this repository.
          required: true
        - label: I understand this is a badge, not a certification.
          required: true
