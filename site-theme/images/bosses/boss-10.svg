    <path d="M41.4 25.4 Q42.8 23.8 43.8 25.6 Q45.4 23.6 46.8 25.2 Q48.6 23.2 50 25 Q51.6 23.2 53.2 25.2 Q54.8 23.6 56.2 25.6 Q57.4 23.8 58.6 25.4 Z" fill="#9a7350"/>
