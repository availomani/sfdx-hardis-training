       open mouth, a blue-grey dotted shirt with a dark collar. -->
  <defs>
    <clipPath id="boss10-round">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
    <pattern id="boss10-dots" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#6f7cab"/>
      <circle cx="1.5" cy="1.5" r="0.5" fill="#4f5a86"/>
    </pattern>
  </defs>
  <g clip-path="url(#boss10-round)">
    <rect width="100" height="100" fill="#ffcfc2"/>
    <!-- Neck, the dotted shirt open at the collar, the dark collar -->
    <path d="M41.6 62 L58.4 62 L60 92 L40 92 Z" fill="#ecba9f"/>
    <path d="M41.8 64 C45.6 70 54.4 70 58.2 64 L58.6 70.4 C54.4 75 45.6 75 41.4 70.4 Z" fill="#d9a084" opacity="0.6"/>
    <path d="M2 100 C4 86 18 79.6 36 77 L50 94 L64 77 C82 79.6 96 86 98 100 Z" fill="url(#boss10-dots)"/>
    <path d="M40.6 69 L34.4 83.6 L46 94 L50 94 Z" fill="#2b3254"/>
