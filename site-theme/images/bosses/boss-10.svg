    <path d="M31.2 39.4 Q31.2 38.4 32.4 38.4 L46.4 38.4 Q47.6 38.4 47.4 39.6 L46.8 45.6 Q46.4 49.2 42.8 49.2 L35.4 49.2 Q32 49.2 31.6 45.8 Z" fill="#ffffff" fill-opacity="0.16" stroke="#1c1a1b" stroke-width="2" stroke-linejoin="round"/>
    <path d="M68.8 39.4 Q68.8 38.4 67.6 38.4 L53.6 38.4 Q52.4 38.4 52.6 39.6 L53.2 45.6 Q53.6 49.2 57.2 49.2 L64.6 49.2 Q68 49.2 68.4 45.8 Z" fill="#ffffff" fill-opacity="0.16" stroke="#1c1a1b" stroke-width="2" stroke-linejoin="round"/>
    <path d="M32.2 38.6 L46.6 38.6 M53.4 38.6 L67.8 38.6" fill="none" stroke="#1c1a1b" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M47.4 41.8 Q50 40.4 52.6 41.8" fill="none" stroke="#1c1a1b" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M31.2 41.4 L28.6 41 M68.8 41.4 L71.4 41" fill="none" stroke="#1c1a1b" stroke-width="1.6" stroke-linecap="round"/>
