    <path d="M50.6 45.6 C51 50 52.4 53.4 52 56.2" fill="none" stroke="#d6987c" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M47 56.6 Q50 58.6 53.4 56.6" fill="none" stroke="#c98b6e" stroke-width="1.2" stroke-linecap="round"/>
