    <path d="M44.2 62.2 Q47 60.6 50 61.4 Q53 60.6 55.8 62.2 Q50 63.2 44.2 62.2 Z" fill="#c07f74"/>
    <path d="M45.6 63.4 Q50 67.4 54.4 63.4 Q50 64.4 45.6 63.4 Z" fill="#d39486"/>
    <path d="M45.4 62.4 Q50 64.4 54.6 62.4 Q50 63.2 45.4 62.4 Z" fill="#7c4441"/>
    <path d="M44.4 62.4 Q50 63.4 55.6 62.4" fill="none" stroke="#8a4c48" stroke-width="0.8" stroke-linecap="round"/>
