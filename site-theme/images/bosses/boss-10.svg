    <circle cx="39.6" cy="43.6" r="2.1" fill="#5f87aa"/>
    <circle cx="60.4" cy="43.6" r="2.1" fill="#5f87aa"/>
    <circle cx="39.6" cy="43.6" r="0.9" fill="#1f2a33"/>
    <circle cx="60.4" cy="43.6" r="0.9" fill="#1f2a33"/>
