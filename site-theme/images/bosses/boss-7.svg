    <path d="M40.6 56.4 Q50 58.4 59.4 56.4 Q56.8 62.8 50 63 Q43.2 62.8 40.6 56.4 Z" fill="#d27375"/>
    <path d="M41.8 57 Q50 58.8 58.2 57 Q56.6 60.6 50 61 Q43.4 60.6 41.8 57 Z" fill="#ffffff"/>
    <path d="M42.6 59.2 Q50 61.6 57.4 59.2" fill="none" stroke="#b0545a" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M40.6 56.4 Q45.3 55.2 50 56 Q54.7 55.2 59.4 56.4 Q50 58.2 40.6 56.4 Z" fill="#c8666b"/>
