<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Boss">
  <!-- A boss of world 9: a woman with straight shoulder-length auburn hair and
       a middle parting, brown eyes, a smile showing teeth, a green satin
       blouse under a black waistcoat. -->
  <defs>
    <clipPath id="boss7-round">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
    <clipPath id="boss7-eyeL">
      <path d="M36.6 41.8 Q40.5 38.2 44.4 41.4 Q40.5 44.2 36.6 41.8 Z"/>
    </clipPath>
    <clipPath id="boss7-eyeR">
