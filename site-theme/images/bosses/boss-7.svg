      <circle cx="59.4" cy="41.2" r="1.1" fill="#24160f"/>
    </g>
    <circle cx="41.4" cy="40.5" r="0.6" fill="#ffffff"/>
    <circle cx="60.2" cy="40.5" r="0.6" fill="#ffffff"/>
    <path d="M36.2 41.9 Q40.5 37.6 44.8 41.2 M55.2 41.2 Q59.5 37.6 63.8 41.9" fill="none" stroke="#35201a" stroke-width="1.4" stroke-linecap="round"/>
