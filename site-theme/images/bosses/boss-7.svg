    <path d="M39 76 C44 79 56 79 61 76 L54 97 L46 97 Z" fill="#f2c9b2"/>
    <path d="M45.5 96 Q50 93 54.5 96 L55.5 100 L44.5 100 Z" fill="#2b2326"/>
    <path d="M5 100 C6 91 11 84.5 21 81 L30 80 L46 100 Z" fill="#1d1d22"/>
    <path d="M95 100 C94 91 89 84.5 79 81 L70 80 L54 100 Z" fill="#1d1d22"/>
