<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Boss">
  <!-- A woman with shoulder-length curly dark brown hair streaked with grey,
       dark rectangular glasses, a big smile, a plain black t-shirt and her
       arms crossed. -->
  <defs>
    <clipPath id="boss3-round">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>
  <g clip-path="url(#boss3-round)">
    <rect width="100" height="100" fill="#fbe3d1"/>
    <!-- Curly hair behind the head -->
    <path d="M25 79 A6 6 0 0 1 17 72 A6 6 0 0 1 13 61 A6 6 0 0 1 14 50 A6 6 0 0 1 17 40 A6 6 0 0 1 22 31 A12 12 0 0 1 32 19 A14 14 0 0 1 50 13 A14 14 0 0 1 68 19 A12 12 0 0 1 78 31 A6 6 0 0 1 83 40 A6 6 0 0 1 86 50 A6 6 0 0 1 87 61 A6 6 0 0 1 83 72 A6 6 0 0 1 75 79 Z" fill="#3b2a22"/>
    <!-- Neck and the black t-shirt -->
    <path d="M43 58 L57 58 L58 71 L42 71 Z" fill="#eab79b"/>
    <path d="M8 100 C10 82 24 73 40 69.5 C45 74.5 55 74.5 60 69.5 C76 73 90 82 92 100 Z" fill="#1d1d22"/>
    <path d="M40 69.5 C45 75.5 55 75.5 60 69.5" fill="none" stroke="#33333b" stroke-width="1.4"/>
    <!-- Upper arms out of the short sleeves, then the crossed forearms, the watch on the wrist on top -->
    <path d="M13 82 Q19 80 26 81.5 L27 95 L12 97 Z" fill="#eab79b"/>
    <path d="M87 82 Q81 80 74 81.5 L73 95 L88 97 Z" fill="#f2c4aa"/>
    <path d="M13 82 Q19 80 26 81.5 M87 82 Q81 80 74 81.5" fill="none" stroke="#111114" stroke-width="1.4"/>
    <path d="M14 99 L66 86" stroke="#eab79b" stroke-width="13" stroke-linecap="round"/>
    <path d="M88 100 L33 87" stroke="#f2c4aa" stroke-width="13" stroke-linecap="round"/>
    <path d="M87 93.6 L34 81" fill="none" stroke="#dca386" stroke-width="0.8"/>
    <ellipse cx="30" cy="86.5" rx="6.5" ry="5.5" fill="#f2c4aa"/>
    <rect x="46" y="84.2" width="4.2" height="12" rx="1.2" fill="#b9b6ae" transform="rotate(13 48 90.5)"/>
    <!-- The face -->
    <ellipse cx="50" cy="43" rx="20.5" ry="21.5" fill="#f5cfb8"/>
    <!-- Curly hair in front, parted on one side -->
    <path d="M25 61 A5 5 0 0 0 31.5 53 C30 44 31 34 35 29 A5 5 0 0 0 42 23.5 C50 22 62 24 68 32 A5 5 0 0 0 70.5 41 C71 46 70.5 50 69.5 54 A5 5 0 0 0 75 61 C83 52 83 30 73 20 C65 12 36 12 28 20 C19 29 19 47 25 61 Z" fill="#45322a"/>
    <!-- Grey streaks in the curls -->
    <g fill="none" stroke="#a79d97" stroke-width="1.1" stroke-linecap="round">
      <path d="M42 23 Q43 18 46 14.5"/>
      <path d="M46 15.5 q9 -1.5 17 3"/>
      <path d="M48 19 q10 -0.5 17 6"/>
      <path d="M40 16 q-6 1.5 -9 6"/>
      <path d="M21 46 q3 -3 0 -6 q-3 -3 0 -6"/>
      <path d="M78 36 q-3 3 0 6 q3 3 0 6 q-3 3 0 6"/>
      <path d="M18 60 q3 3 1 7"/>
      <path d="M82 62 q-3 3 -1 7"/>
      <path d="M27 52 q-3 3 0 6"/>
      <path d="M73 50 q3 3 0 6"/>
    </g>
    <!-- Eyebrows -->
    <path d="M35.5 33.5 Q41 30.6 46.5 32.8" fill="none" stroke="#3a2a22" stroke-width="2" stroke-linecap="round"/>
    <path d="M53.5 32.8 Q59 30.6 64.5 33.5" fill="none" stroke="#3a2a22" stroke-width="2" stroke-linecap="round"/>
    <!-- Smiling eyes -->
    <ellipse cx="41" cy="41" rx="2.4" ry="2.1" fill="#2e2019"/>
    <ellipse cx="59" cy="41" rx="2.4" ry="2.1" fill="#2e2019"/>
    <circle cx="41.8" cy="40.3" r="0.8" fill="#ffffff"/>
    <circle cx="59.8" cy="40.3" r="0.8" fill="#ffffff"/>
    <path d="M37.8 40.2 Q41 37.6 44.2 40.2 M55.8 40.2 Q59 37.6 62.2 40.2" fill="none" stroke="#2e2019" stroke-width="1.1" stroke-linecap="round"/>
    <!-- Dark rectangular glasses -->
    <g fill="#ffffff" fill-opacity="0.15" stroke="#3d1d1f" stroke-width="2.1">
      <rect x="33.5" y="36" width="14.5" height="10" rx="3"/>
      <rect x="52" y="36" width="14.5" height="10" rx="3"/>
    </g>
    <path d="M48 39.5 Q50 38 52 39.5 M33.5 39 L30 38 M66.5 39 L70 38" fill="none" stroke="#3d1d1f" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Rosy cheeks and freckles -->
    <ellipse cx="35.5" cy="51" rx="4.6" ry="3" fill="#ef948c" opacity="0.45"/>
    <ellipse cx="64.5" cy="51" rx="4.6" ry="3" fill="#ef948c" opacity="0.45"/>
    <g fill="#c98a6c" opacity="0.5">
      <circle cx="44" cy="48" r="0.5"/><circle cx="46" cy="49.5" r="0.5"/><circle cx="54" cy="48" r="0.5"/><circle cx="56" cy="49.5" r="0.5"/>
    </g>
    <!-- Nose -->
    <path d="M49.5 44.5 Q52 49 49 50.2" fill="none" stroke="#d99f84" stroke-width="1.3" stroke-linecap="round"/>
    <!-- The big smile with teeth -->
    <path d="M39.5 53.5 Q50 56.5 60.5 53.5 Q58 61 50 61.5 Q42 61 39.5 53.5 Z" fill="#8a3a40"/>
    <path d="M41 54.2 Q50 57.2 59 54.2 L58.2 58 Q50 60.4 41.8 58 Z" fill="#ffffff"/>
    <path d="M43 60 Q50 62.6 57 60" fill="none" stroke="#e07c86" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M39.5 53.5 Q50 56.5 60.5 53.5 Q58 61 50 61.5 Q42 61 39.5 53.5 Z" fill="none" stroke="#b4565f" stroke-width="1.1" stroke-linejoin="round"/>
  </g>
</svg>
