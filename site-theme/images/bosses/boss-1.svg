<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Boss">
  <!-- A boss as a cartoon: a slim young face turned a little, long light brown
       hair in a mullet with a straight blunt fringe, thin metal aviator glasses,
       a thin moustache and a chin beard, a big open smile, a denim jacket over
       a white shirt. -->
  <defs>
    <clipPath id="boss1-b1Round">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
    <linearGradient id="boss1-b1Hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#866c58"/>
      <stop offset="1" stop-color="#a68e78"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#boss1-b1Round)">
    <rect width="100" height="100" fill="#ecdaf3"/>
    <!-- Back of the head -->
    <path d="M50 10.8 C33.6 10.8 25.4 21.6 26.4 36 C27.6 46 28.6 54 30 62 L70 62 C71.6 54 72.6 46 73 36 C74.6 21.6 66.4 10.8 50 10.8 Z" fill="#76604f"/>
    <!-- Neck, white shirt and the denim jacket -->
    <path d="M42.4 64 L55.6 64 L56.6 80 L41.4 80 Z" fill="#efc4ab"/>
    <path d="M6 100 C9 88 20 81 36 78 L64 78 C80 81 91 88 94 100 Z" fill="#8eaac4"/>
    <path d="M38 78 L60 78 L62 100 L37 100 Z" fill="#f7f7f5"/>
    <path d="M41.4 78 L49 90 L56.6 78 Z" fill="#efc4ab"/>
    <path d="M40.6 75.6 L45.6 86.6 L38.4 91.4 L36.4 79.4 Z M57.4 75.6 L52.4 86.6 L59.6 91.4 L61.6 79.4 Z" fill="#ffffff" stroke="#d0d4da" stroke-width="0.6" stroke-linejoin="round"/>
    <path d="M35.6 76.4 L40.6 92 L37.6 100 L27 100 L24.6 86 Z M62.4 76.4 L57.4 92 L60.4 100 L73 100 L75.4 86 Z" fill="#a3bdd4" stroke="#6c8eae" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- The long back of the mullet, falling on the jacket -->
    <path d="M69.6 50 C70.6 60 73.6 68 76.6 76 C78.6 82 79.2 88 77.8 94.6 L74.8 90.4 L73 96.4 L70.4 90 C68.8 84 66 78 63 72.4 C61 68.4 60 64 60 60 Z" fill="url(#boss1-b1Hair)"/>
    <path d="M71.4 64 C73.4 70 76 76 77 84" fill="none" stroke="#bba48e" stroke-width="0.9" stroke-linecap="round"/>
    <!-- Ear on the right -->
    <ellipse cx="67.2" cy="49.4" rx="3" ry="4.8" fill="#e9b59c"/>
    <path d="M67.8 47 Q69 49.4 67.6 51.8" fill="none" stroke="#d29a82" stroke-width="0.8" stroke-linecap="round"/>
    <!-- The slim face, a narrow chin -->
    <path d="M33.8 44 C33.8 31 40.6 23 50 23 C59.6 23 66.6 31 66.6 44 C66.6 55 63.2 64.4 57 70.6 C54.2 73.4 51.4 75 48.6 75 C45.8 75 43.4 73.4 41 70.4 C36.4 64.4 33.8 55 33.8 44 Z" fill="#f3cdb6"/>
    <!-- Stubble along the jaw and around the mouth -->
    <path d="M35 54.6 C36.6 62 39.6 67.6 43.4 71.4 C45.4 73.6 47 74.6 48.6 74.6 C50.6 74.6 52.6 73.6 55 71.4 C59.4 67.4 63 62 64.8 54.6 C62.4 61 58.6 64.6 54 64.4 C53 60 44 60 43 64.4 C39.4 64.6 36.8 61 35 54.6 Z" fill="#b38d72" opacity="0.38"/>
    <!-- The long hair on the left, falling past the cheek to the jacket -->
    <path d="M29.4 46 C31.6 48.4 34.4 51 35 55.6 C35.6 61 34.6 67 32.6 72.6 C30.8 78 30.2 84 30.6 90 L27.4 86.6 L26.4 94 L23.6 88 C21.8 82 22.4 75 24.6 68 C26.6 61 27.4 53 29.4 46 Z" fill="url(#boss1-b1Hair)"/>
    <path d="M30.4 60 C30 68 27.4 76 26.6 84" fill="none" stroke="#bba48e" stroke-width="0.9" stroke-linecap="round"/>
    <!-- Hair on top: a full rounded crown and the straight blunt fringe -->
    <path d="M29 50 C24.2 41 24.4 24.6 33.6 16.4 C39.2 11.6 45 10.4 51 10.4 C62 10.6 71.4 16 74 26.2 C76 34.6 74 43.8 70.4 49.4 C69.6 45 68.8 42.2 67.6 40.4 L65.6 41 L63.2 40.2 L60.6 41 L58 40.2 L55.2 41 L52.6 40.2 L50 41 L47.2 40.2 L44.6 41 L42 40.2 L39.4 41 L36.8 40.2 L34.2 41 L31.6 40.6 C30.4 43.6 29.6 46.6 28.6 50 Z" fill="#927762"/>
    <path d="M38.4 18.6 C35 22.4 33.4 26.6 32.8 31.4 M60 14.6 C64.6 16.2 68.4 20 70.2 25 M38.2 36.6 L37.8 39.6 M45.2 36.6 L45.2 40 M53.2 36.6 L53.4 40 M60.6 36.6 L61.2 39.6" fill="none" stroke="#ad937d" stroke-width="0.9" stroke-linecap="round"/>
    <!-- Eyes, a little narrowed by the smile -->
    <ellipse cx="40.4" cy="46.7" rx="1.7" ry="1.5" fill="#3a2a20"/>
    <ellipse cx="57.6" cy="46.7" rx="1.7" ry="1.5" fill="#3a2a20"/>
    <circle cx="41" cy="46" r="0.55" fill="#ffffff"/>
    <circle cx="58.2" cy="46" r="0.55" fill="#ffffff"/>
    <path d="M37.8 48.6 Q40.4 49.8 43 48.6 M55 48.6 Q57.6 49.8 60.2 48.6" fill="none" stroke="#d9a08a" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Thin metal aviator glasses -->
    <path d="M33.2 42 L46.6 42 C47.2 44 47 47 45.6 49.4 C44.2 51.6 41.4 52.2 38.6 51.4 C35.4 50.4 33.6 47.6 33.3 44.8 Z M50.4 42 L65.4 42 L65.2 44.8 C64.8 47.6 62.8 50.4 59.2 51.4 C56.2 52.2 53.2 51.6 51.8 49.4 C50.2 47 49.8 44 50.4 42 Z" fill="#ffffff" fill-opacity="0.22" stroke="#6c737b" stroke-width="1.15" stroke-linejoin="round"/>
    <path d="M46.6 42 L50.4 42 M46.9 44.4 Q48.5 43.2 50.1 44.4 M33.2 42 L30.4 42.6 M65.4 42 L68.6 42.8" fill="none" stroke="#6c737b" stroke-width="1.1" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M49.2 48 Q51.4 54.2 48.4 55.8 Q46.8 56.2 45.8 55.4" fill="none" stroke="#d99b82" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Cheeks -->
    <ellipse cx="37.4" cy="55" rx="3" ry="1.9" fill="#ec8c80" opacity="0.3"/>
    <ellipse cx="60.6" cy="55" rx="3" ry="1.9" fill="#ec8c80" opacity="0.3"/>
    <!-- Thin moustache -->
    <path d="M38.8 61.4 C41 58.2 45.4 57.6 48.4 58.8 C51.4 57.6 55.8 58.2 58 61.4 C55 59.8 51.6 59.8 48.4 60.2 C45.2 59.8 41.8 59.8 38.8 61.4 Z" fill="#5a3f2e"/>
    <!-- Big open smile -->
    <path d="M39.6 60.8 Q48.4 62.6 57.2 60.8 Q54.8 67.4 48.4 67.6 Q42 67.4 39.6 60.8 Z" fill="#8a3338"/>
    <path d="M40.6 61.2 Q48.4 63 56.2 61.2 L55.4 63.4 Q48.4 65.2 41.4 63.4 Z" fill="#ffffff"/>
    <path d="M43.8 65.8 Q48.4 67.6 53 65.8 Q48.4 68.6 43.8 65.8 Z" fill="#d9707a"/>
    <!-- Chin beard -->
    <path d="M45.2 69.4 C46.8 70.2 50 70.2 51.6 69.4 C52.2 72.6 50.8 75.4 48.4 76.6 C46 75.4 44.6 72.6 45.2 69.4 Z" fill="#5a3f2e"/>
  </g>
</svg>
