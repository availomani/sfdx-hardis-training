<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Boss">
  <!-- A young man in three-quarter view, laughing with his eyes shut: short
       curly light brown hair, faded on the sides, a short beard, a small
       headset microphone at the cheek, a navy polo and a yellow lanyard. -->
  <defs>
    <clipPath id="boss4-round">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>
  <g clip-path="url(#boss4-round)">
    <rect width="100" height="100" fill="#e4f1c4"/>
    <!-- Neck and the navy polo -->
    <path d="M42 60 L62 57 L63 76 L42 78 Z" fill="#e3a888"/>
    <path d="M4 100 C6 84 22 76 40 73 L64 71 C80 74 94 82 97 100 Z" fill="#46506e"/>
    <path d="M38.5 72.5 L46 84 L51 77 L43 71 Z M65 70.5 L57 83 L52.5 77 L60 69.5 Z" fill="#3b4562"/>
    <path d="M38.5 72.5 L46 84 L51 77 M65 70.5 L57 83 L52.5 77" fill="none" stroke="#5a6690" stroke-width="1" stroke-linejoin="round"/>
    <path d="M51.5 79 L51.5 93" stroke="#363f5b" stroke-width="1.2"/>
    <circle cx="51.5" cy="85" r="0.9" fill="#6a76a0"/>
    <circle cx="51.5" cy="90" r="0.9" fill="#6a76a0"/>
    <!-- The yellow lanyard -->
    <path d="M41 74 C40 84 41 93 43 100 M62 72 C61 82 58 92 56 100" fill="none" stroke="#f2c32c" stroke-width="2.4" stroke-linecap="round"/>
    <!-- The face, turned to one side -->
    <path d="M33 24 C42 18 58 18 66 24 C69 32 69 46 66 54 C62 63 52 69 43 68 C36 67 31 61 29.5 53 C28.5 46 29 39 30 35 C30.5 30 31 27 33 24 Z" fill="#f0c2a2"/>
    <!-- Ear -->
    <ellipse cx="67.5" cy="43" rx="3.6" ry="6" fill="#e8ae8e"/>
    <path d="M68 39.5 Q70.2 43 67.6 46.5" fill="none" stroke="#cf8f72" stroke-width="1" stroke-linecap="round"/>
    <!-- Short beard -->
    <path d="M30 49 C31 51.5 32 53 33.5 53.5 C38 51.8 46 51.6 52 52 C55.5 53 59 52 62 48.5 C63.5 46.5 64.5 44 65.5 42 L67.8 44 C68 52 64 60 56 65.5 C50 69.5 42 70.5 37 67 C32 63 30 56 30 49 Z" fill="#a36c45" opacity="0.8"/>
    <!-- Faded sides and the curly top -->
    <path d="M59 23 C64 23 68 25 70.5 27 L70.5 38 C68.5 36.5 66.5 36.5 65 37.5 C64 33 62 28 59 23 Z" fill="#8a6246" opacity="0.55"/>
    <path d="M30 34 A4 4 0 0 1 28 27 A4.5 4.5 0 0 1 29 19 A5 5 0 0 1 35 13 A5 5 0 0 1 43 9 A5 5 0 0 1 52 8 A5 5 0 0 1 60 9.5 A5 5 0 0 1 67 14 A5 5 0 0 1 70.5 22 L70.5 27 A4 4 0 0 1 64 24.5 A4 4 0 0 1 57 23 A4 4 0 0 1 50 23 A4 4 0 0 1 43 24 A4 4 0 0 1 37 25.5 A4 4 0 0 1 33 28 Z" fill="#a8763f"/>
    <g fill="none" stroke="#d6aa6e" stroke-width="1.2" stroke-linecap="round">
      <path d="M33 18 a2.6 2.6 0 1 1 3.6 2.8"/>
      <path d="M41 13 a2.6 2.6 0 1 1 3.6 2.8"/>
      <path d="M50 12 a2.6 2.6 0 1 1 3.6 2.8"/>
      <path d="M58 14 a2.6 2.6 0 1 1 3.6 2.8"/>
      <path d="M37 21.5 a2.4 2.4 0 1 1 3.4 2.4"/>
      <path d="M47 18.5 a2.4 2.4 0 1 1 3.4 2.4"/>
      <path d="M30.5 25 a2.2 2.2 0 1 1 3 2"/>
    </g>
    <!-- Eyebrows -->
    <path d="M31.5 35.5 Q34.5 33 38 34 M45 33.5 Q50 31 56 33" fill="none" stroke="#7d5433" stroke-width="2.3" stroke-linecap="round"/>
    <!-- Eyes shut with laughter -->
    <path d="M32.5 41 Q35 38 37.8 40.5 M45 41 Q49.5 37.2 54 40.5" fill="none" stroke="#3a2618" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M55 42 L57.5 43 M55.2 40 L57.6 39.4" fill="none" stroke="#d2957a" stroke-width="0.9" stroke-linecap="round"/>
    <!-- Rosy cheek -->
    <ellipse cx="54" cy="46" rx="4.5" ry="2.6" fill="#ec8f80" opacity="0.4"/>
    <!-- Nose -->
    <path d="M41 39 C40 43 37 46 35.8 48.5 C36.5 50.5 40 51 43 50" fill="none" stroke="#c98767" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Laughing mouth -->
    <path d="M33.5 54 C38 55.5 46 56 52 53.5 C50 60 46 63 41 62.5 C37 62 34.5 58.5 33.5 54 Z" fill="#6b2a2c"/>
    <path d="M35 54.6 C40 56 46 56.2 50.5 54.2 L49.8 56.6 C45 58.2 39.5 58 35.6 56.6 Z" fill="#ffffff"/>
    <ellipse cx="42" cy="60.6" rx="4" ry="1.5" fill="#d0646c"/>
    <!-- Headset microphone -->
    <path d="M31.6 55 C33.4 52 33.6 48.5 32.4 45.5" fill="none" stroke="#d9bb93" stroke-width="1" stroke-linecap="round"/>
    <ellipse cx="31" cy="55.8" rx="2.3" ry="2.1" fill="#d6b48e"/>
  </g>
</svg>
