    <ellipse cx="71.8" cy="43" rx="3.6" ry="6.6" fill="#e5b398"/>
    <path d="M27.4 39.6 Q25.6 43 27.6 47 M72.6 39.6 Q74.4 43 72.4 47" fill="none" stroke="#c98d72" stroke-width="0.8" stroke-linecap="round"/>
