<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Boss">
  <!-- A man with a shaved head and very short dark hair, thick dark
       eyebrows, a neat short dark beard, a neutral look and a black
       crew-neck t-shirt. -->
  <defs>
    <clipPath id="boss15-round">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
    <linearGradient id="boss15-head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4cdb5"/>
      <stop offset="0.45" stop-color="#eebfa5"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#boss15-round)">
    <rect width="100" height="100" fill="#d5dde6"/>
    <!-- The long neck and the black t-shirt -->
    <path d="M38 68 L62 68 L63 90 L37 90 Z" fill="#e3b094"/>
    <path d="M38.4 70 C43 76 57 76 61.6 70 L62 77 C57 81 43 81 38 77 Z" fill="#c99478"/>
    <path d="M0 100 L0 90 C8 86 22 83 34 82 C38 91 62 91 66 82 C78 83 92 86 100 90 L100 100 Z" fill="#1b1b1e"/>
    <path d="M34 82 C38 91.6 62 91.6 66 82" fill="none" stroke="#2f2f35" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Ears, standing out a little -->
