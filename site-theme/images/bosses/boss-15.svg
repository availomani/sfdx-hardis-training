    <path d="M49.6 40 C50 44 51.8 47.6 51.4 50.4" fill="none" stroke="#cf9276" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M46 50.6 Q50 53.6 54 50.6" fill="none" stroke="#c48468" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Full lips, a neutral mouth -->
    <path d="M42.6 58.6 Q50 60.2 57.4 58.6 Q55 63.2 50 63.2 Q45 63.2 42.6 58.6 Z" fill="#d98e8c"/>
    <path d="M42 58.4 Q46 56.4 50 57.4 Q54 56.4 58 58.4 Q50 59.8 42 58.4 Z" fill="#c27674"/>
    <path d="M42.4 58.6 Q50 60 57.6 58.6" fill="none" stroke="#9a5452" stroke-width="0.9" stroke-linecap="round"/>
  </g>
</svg>
