    <path d="M29.6 42 C28.6 24 38 12 50 12 C62 12 71.4 24 70.4 42 C70.2 51 68.6 58 65.6 64 C62 71.4 56.4 76 50 76 C43.6 76 38 71.4 34.4 64 C31.4 58 29.8 51 29.6 42 Z" fill="url(#boss15-head)"/>
    <!-- Very short dark hair on the sides and around the crown -->
    <path d="M29.7 41 C29.2 26 37 12.2 50 12.2 C63 12.2 70.8 26 70.3 41 L68.2 41 C68.4 32 66.6 25 62.4 20.4 C58.6 16.6 54.4 15 50 15 C45.6 15 41.4 16.6 37.6 20.4 C33.4 25 31.6 32 31.8 41 Z" fill="#2f2a27" opacity="0.42"/>
    <ellipse cx="44.4" cy="20.4" rx="6" ry="2.6" fill="#f9dcc9" opacity="0.6"/>
    <!-- A neat short dark beard and moustache, denser over the lip and on the chin -->
    <path d="M30.2 49 C31 55 32.4 60 34.6 64.4 C38.2 71.8 43.6 77 50 77 C56.4 77 61.8 71.8 65.4 64.4 C67.6 60 69 55 69.8 49 C67.8 52 65 54 61.6 55 C58 52.4 54 51.6 50 51.8 C46 51.6 42 52.4 38.4 55 C35 54 32.2 52 30.2 49 Z M29.7 41 L31.8 41 L32.6 51 L30.3 50.6 Z M70.3 41 L68.2 41 L67.4 51 L69.7 50.6 Z" fill="#5c504a"/>
    <path d="M40.6 56 C44 52.6 56 52.6 59.4 56 C56 56.8 44 56.8 40.6 56 Z" fill="#463b35"/>
    <!-- Thick dark eyebrows, angled -->
    <path d="M34 32.8 Q37.4 29.8 41 29.6 Q43.8 29.6 45.6 30.8" fill="none" stroke="#2a201c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M54.4 30.8 Q56.2 29.6 59 29.6 Q62.6 29.8 66 32.8" fill="none" stroke="#2a201c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hazel eyes under heavy lids -->
    <path d="M36.8 39 Q41 35.4 45.2 38.6 Q41 40.8 36.8 39 Z M54.8 38.6 Q59 35.4 63.2 39 Q59 40.8 54.8 38.6 Z" fill="#ffffff"/>
    <circle cx="41" cy="38.3" r="2.1" fill="#7a5a3a"/>
    <circle cx="59" cy="38.3" r="2.1" fill="#7a5a3a"/>
    <circle cx="41" cy="38.3" r="0.95" fill="#221811"/>
    <circle cx="59" cy="38.3" r="0.95" fill="#221811"/>
    <circle cx="41.7" cy="37.6" r="0.55" fill="#ffffff"/>
    <circle cx="59.7" cy="37.6" r="0.55" fill="#ffffff"/>
    <path d="M36.4 39 Q41 34.8 45.6 38.4 M54.4 38.4 Q59 34.8 63.6 39" fill="none" stroke="#2e221c" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M37.6 36 Q41 34 44.8 35.6 M55.2 35.6 Q59 34 62.4 36" fill="none" stroke="#d49c84" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M38 41.8 Q41 43 44 41.8 M56 41.8 Q59 43 62 41.8" fill="none" stroke="#d9a28a" stroke-width="0.8" stroke-linecap="round"/>
