    <path d="M24.6 47 C24.4 58 26.6 66 31.4 71.6 C36.4 77.6 43 81 50 81 C57 81 63.6 77.6 68.6 71.6 C73.4 66 75.6 58 75.4 47 C73.8 54 70 58.4 64.6 59.6 C61.6 58 58.6 57 56 57.6 C53.8 56.8 51.8 57.2 50 57.8 C48.2 57.2 46.2 56.8 44 57.6 C41.4 57 38.4 58 35.4 59.6 C30 58.4 26.2 54 24.6 47 Z" fill="#6f523d"/>
    <path d="M35.4 59.6 C38.4 58 41.4 57 44 57.6 C46.2 56.8 48.2 57.2 50 57.8 C51.8 57.2 53.8 56.8 56 57.6 C58.6 57 61.6 58 64.6 59.6 C63.6 61.4 62.6 62.2 61.6 62.4 C57 61.4 43 61.4 38.4 62.4 C37.4 62.2 36.4 61.4 35.4 59.6 Z" fill="#7d5c41"/>
    <path d="M46.6 74 C46.8 75.6 47.4 77 48.2 78 M50 74.4 L50 79 M53.4 74 C53.2 75.6 52.6 77 51.8 78 M37.8 65.6 C38.2 67.4 39 68.8 40.2 70 M62.2 65.6 C61.8 67.4 61 68.8 59.8 70 M30.8 61.4 C31.6 63.4 32.6 65 34 66.4 M69.2 61.4 C68.4 63.4 67.4 65 66 66.4 M42.6 59.8 C44.4 59.2 46.2 59.2 47.8 59.6 M57.4 59.8 C55.6 59.2 53.8 59.2 52.2 59.6" fill="none" stroke="#a39382" stroke-width="1" stroke-linecap="round"/>
    <!-- The wide grin showing the upper teeth -->
    <path d="M37.6 62.2 Q50 64.6 62.4 62.2 Q58.4 69.4 50 69.8 Q41.6 69.4 37.6 62.2 Z" fill="#7a2c2c"/>
    <path d="M38.8 62.6 Q50 65 61.2 62.6 L60.2 65.2 Q50 67.6 39.8 65.2 Z" fill="#fffaf2"/>
    <path d="M43 68.6 Q50 70.8 57 68.6 Q50 72.2 43 68.6 Z" fill="#b96357"/>
    <path d="M37.6 62.2 Q36.2 61.6 35.6 60.2 M62.4 62.2 Q63.8 61.6 64.4 60.2" fill="none" stroke="#4e3a2b" stroke-width="0.9" stroke-linecap="round"/>
    </g>
  </g>
</svg>
