    <path d="M21.4 41.4 C20.4 35 20.8 30 22.6 25.6 C25 14.6 35.4 4.2 50 4.2 C64.6 4.2 75 14.6 77.4 25.6 C79.2 30 79.6 35 78.6 41.4 C78.4 39.6 77.4 38.4 76 37.6 C74.4 34 72.6 31.4 70.4 29.6 C68.6 27.6 67 26.6 65.4 26.8 C61.6 23.6 56 22.6 50 22.8 C44 22.6 38.4 23.6 34.6 26.8 C33 26.6 31.4 27.6 29.6 29.6 C27.4 31.4 25.6 34 24 37.6 C22.6 38.4 21.6 39.6 20.6 41.6 Z" fill="url(#finalboss-fbHair)"/>
