<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Final boss">
  <!-- The final boss as a cartoon: a broad fleshy face, thick brown hair swept
       straight back with volume on top and waves behind the ears down to the
       collar, a short dark brown beard with grey, a wide grin showing the upper
       teeth, eyes squinted by the grin, an open-collar bright blue shirt. -->
