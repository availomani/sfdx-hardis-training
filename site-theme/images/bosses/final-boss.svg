    <ellipse cx="75.8" cy="46.4" rx="3.8" ry="6.2" fill="#d48f70"/>
    <path d="M23.2 43.4 Q21.8 46.4 23.6 49.6 M76.8 43.4 Q78.2 46.4 76.4 49.6" fill="none" stroke="#b9735a" stroke-width="0.8" stroke-linecap="round"/>
