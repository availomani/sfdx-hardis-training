    <path d="M36.8 47 Q40.4 48.6 44 47 M56 47 Q59.6 48.6 63.2 47 M34.4 43 L31.8 41.8 M34.6 44.8 L31.8 45.2 M35.2 46.4 L32.8 47.8 M65.6 43 L68.2 41.8 M65.4 44.8 L68.2 45.2 M64.8 46.4 L67.2 47.8" fill="none" stroke="#b9735a" stroke-width="0.85" stroke-linecap="round"/>
