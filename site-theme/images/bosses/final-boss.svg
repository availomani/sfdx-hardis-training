    <clipPath id="finalboss-fbRound">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
    <linearGradient id="finalboss-fbHair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4630"/>
      <stop offset="1" stop-color="#4a3121"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#finalboss-fbRound)">
    <rect width="100" height="100" fill="#fce5ab"/>
    <g transform="translate(0 2.6)">
    <!-- The back of the mane, waves bulging behind both ears to the collar -->
    <path d="M50 6 C31 6 19.6 16 20.4 30 C20.8 36 20.4 40 19.6 44 C17.4 48 17.2 53 19.4 57 C17.2 61 17.6 66 21 69 C19.8 72 22 74.6 25.4 73.8 C28.4 75 31.6 73.4 33 70.6 L67 70.6 C68.4 73.4 71.6 75 74.6 73.8 C78 74.6 80.2 72 79 69 C82.4 66 82.8 61 80.6 57 C82.8 53 82.6 48 80.4 44 C79.6 40 79.2 36 79.6 30 C80.4 16 69 6 50 6 Z" fill="#4a3121"/>
    <path d="M19.8 47 C18.6 49.6 19 52.6 21.2 54.6 M20 60 C19 62.6 19.8 65.6 22.2 67.4 M22.6 71.4 C23.6 72.8 25.2 73.4 26.8 73 M80.2 47 C81.4 49.6 81 52.6 78.8 54.6 M80 60 C81 62.6 80.2 65.6 77.8 67.4 M77.4 71.4 C76.4 72.8 74.8 73.4 73.2 73" fill="none" stroke="#7a5538" stroke-width="1" stroke-linecap="round"/>
    <!-- The shirt, a thick neck in the wide open collar -->
    <path d="M2 100 C5 86 19 79 36 75.4 L64 75.4 C81 79 95 86 98 100 Z" fill="#239be6"/>
    <path d="M38.6 62 L61.4 62 L62.4 76 L50 93 L37.6 76 Z" fill="#cf8a6b"/>
    <path d="M37.6 73 C44 71 56 71 62.4 73 L62.4 76 C56 74.4 44 74.4 37.6 76 Z" fill="#1a7fc4"/>
    <path d="M37.4 71.6 L32.6 80 L22.6 87.6 L36 89.4 L50 94 L40.4 77.6 Z" fill="#3cb0f4" stroke="#1d86cc" stroke-width="0.8" stroke-linejoin="round"/>
