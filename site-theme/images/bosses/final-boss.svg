    <path d="M44 53.6 C44.2 56.2 46.8 56.6 48.2 55.8 M56 53.6 C55.8 56.2 53.2 56.6 51.8 55.8" fill="none" stroke="#ad694f" stroke-width="0.9" stroke-linecap="round"/>
    <ellipse cx="50.6" cy="53" rx="1.8" ry="1.2" fill="#e9b094"/>
