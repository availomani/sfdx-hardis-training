    <path d="M24.6 42 C24.6 27 35.6 19.4 50 19.4 C64.4 19.4 75.4 27 75.4 42 C75.8 54 74.6 62.4 69.6 69 C64.4 75.6 57.6 78.4 50 78.4 C42.4 78.4 35.6 75.6 30.4 69 C25.4 62.4 24.2 54 24.6 42 Z" fill="#e09d7e"/>
    <path d="M39 28.8 Q50 27.2 61 28.8 M41.4 31.8 Q50 30.8 58.6 31.8" fill="none" stroke="#c98366" stroke-width="0.7" stroke-linecap="round"/>
