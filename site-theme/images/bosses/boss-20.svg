<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Boss">
  <!-- A boss of world 9: a woman with platinum blond shoulder-length wavy hair,
       darker roots and a side parting, blue-grey eyes, red lips, gold hoop
       earrings, a gold collar necklace, a black sleeveless top. -->
  <defs>
    <clipPath id="boss20-round">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
    <linearGradient id="boss20-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#857563"/>
      <stop offset="0.3" stop-color="#c4b8a2"/>
      <stop offset="0.55" stop-color="#e2d9c8"/>
      <stop offset="1" stop-color="#f0eadf"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#boss20-round)">
    <rect width="100" height="100" fill="#ffd6de"/>
    <!-- Bare shoulders and the black sleeveless top with lapels -->
    <path d="M4 100 C6 89 16 83.6 32 81 L41 68 L59 68 L68 81 C84 83.6 94 89 96 100 Z" fill="#efc6b0"/>
    <path d="M14 100 C15.6 92 20.6 86.4 28 83.4 L37.4 79.6 L48.4 100 Z M86 100 C84.4 92 79.4 86.4 72 83.4 L62.6 79.6 L51.6 100 Z" fill="#1b1c22"/>
    <path d="M37.4 79.6 L42.4 91.6 L38.8 94 M62.6 79.6 L58 89.6 L62.4 90.4 L57.6 99" fill="none" stroke="#3b3c46" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="rotate(-8 50 60)">
      <!-- Hair behind, down to the shoulders, the ends flicking out -->
      <path d="M50 9.6 C34 10 25.4 21.6 26 37.6 C26.6 46 25.4 52 24.6 58 C23.4 61.6 24.6 64.6 23.4 68 C22 71.6 19.6 74.2 17 76.4 C17.6 79.6 20.6 81.6 24 81 C26 82.8 29.4 82.6 31.6 80.8 C34 82.4 37.4 81.6 39 79 L61 79 C63.4 80.8 66.6 81 68.8 79.2 C71.4 80.6 74.8 80.2 76.8 78.2 C79.6 78.4 82 76.6 82.6 74 C80 72 77.6 69.6 76.4 66.6 C75.2 63.4 75.4 60.4 74.2 57.4 C73 53 72.6 49 74.4 44.4 C76.6 39.4 77.4 33 76 27 C73.4 15.6 64.4 9.4 50 9.6 Z" fill="url(#boss20-hair)"/>
      <path d="M25.4 62 C26.6 66 25.4 70 22 73.6 M28 72.6 C27.6 76 26.2 78.6 24 80.4 M74.6 60 C74 64 75.4 68 79 71.4 M72.6 70 C73 73.6 74.6 76.4 76.8 78" fill="none" stroke="#d6cbb6" stroke-width="1" stroke-linecap="round"/>
      <!-- Neck -->
      <path d="M43.4 60 L56.6 60 L57.4 77 L42.6 77 Z" fill="#e8bca4"/>
      <!-- The ear on the right with a chunky gold hoop -->
      <ellipse cx="66.6" cy="49.6" rx="3" ry="5" fill="#ebbca4"/>
      <circle cx="67" cy="56.2" r="1.9" fill="none" stroke="#d4a54a" stroke-width="1.3"/>
      <!-- The oval face, high cheekbones -->
      <path d="M34 43 C34 30 41 22.6 50 22.6 C59 22.6 66 30 66 43 C66 54 64.4 61 60.6 66.8 C57.6 71.4 54 75.2 50 75.2 C46 75.2 42.4 71.4 39.4 66.8 C35.6 61 34 54 34 43 Z" fill="#f4cfba"/>
      <!-- Hair in front: a side parting, a long wavy lock on the left, a wide swoop over the right -->
      <path d="M44 13.4 C35.4 14.4 29.6 21.4 28.6 30.6 C27.8 38 29.6 44 29.2 50 C28.8 55 27 58.6 27.4 62.6 C27.8 66.4 26.6 70 24.4 73.6 C23.2 75.6 22 77.6 20.4 79.4 C24.6 79.4 28.4 77 30.4 73.6 C32.4 70.4 32.2 66.4 31.6 63 C31.2 59.6 33.4 56.6 33.6 52.4 C33.8 47 33 41 34.6 35 C36.2 27.6 39.4 20.6 44 13.4 Z" fill="url(#boss20-hair)"/>
      <path d="M44 13.4 C53.6 9.8 66.4 13 72.2 23.2 C75.6 29.6 75.6 37 73 44.4 C70.8 39.6 69.4 35.6 67 32.6 C64.6 29.6 61.4 27.8 57.6 26.6 C53.4 25.4 49.4 25.2 46.4 25.6 C45.2 21.8 44.4 18 44 13.4 Z" fill="url(#boss20-hair)"/>
      <path d="M54 17.4 C58.6 17.8 62.6 20.2 65.2 23.8 M31.4 38 C30.8 44 31.8 49 30.8 55 M28.8 64 C28.6 67.4 27.6 70.4 26 73" fill="none" stroke="#f2ece1" stroke-width="1" opacity="0.85" stroke-linecap="round"/>
      <path d="M44 13.4 C43.4 17.4 43.4 20.6 44.4 24" fill="none" stroke="#76665a" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M47.6 21.6 C54.6 20.6 61.6 23 66.4 28.4 M60.6 17.4 C65 19 68.4 22 70.4 26" fill="none" stroke="#b3a68f" stroke-width="0.9" stroke-linecap="round"/>
      <!-- Defined, softly arched eyebrows -->
      <path d="M36.8 38.6 Q41 35.8 45.6 37.4" fill="none" stroke="#8a6f59" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M54.4 37.4 Q59 35.8 63.2 38.6" fill="none" stroke="#8a6f59" stroke-width="1.7" stroke-linecap="round"/>
      <!-- Blue-grey almond eyes, a little narrowed, dark liner -->
      <path d="M37.4 44 Q41.2 41.8 45 43.6 Q41.2 45.6 37.4 44 Z" fill="#ffffff"/>
      <path d="M55 43.6 Q58.8 41.8 62.6 44 Q58.8 45.6 55 43.6 Z" fill="#ffffff"/>
      <circle cx="41.2" cy="43.6" r="1.75" fill="#7c9db3"/>
      <circle cx="58.8" cy="43.6" r="1.75" fill="#7c9db3"/>
      <circle cx="41.2" cy="43.6" r="0.75" fill="#25303a"/>
      <circle cx="58.8" cy="43.6" r="0.75" fill="#25303a"/>
      <circle cx="41.8" cy="43" r="0.5" fill="#ffffff"/>
      <circle cx="59.4" cy="43" r="0.5" fill="#ffffff"/>
      <path d="M37 44 Q41.2 41.4 45.4 43.4 M54.6 43.4 Q58.8 41.4 63 44" fill="none" stroke="#2f2622" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M37.8 41.6 Q41.2 39.6 44.8 41.4 M55.2 41.4 Q58.8 39.6 62.2 41.6 M38 46.4 Q41.2 47.6 44.4 46.4 M55.6 46.4 Q58.8 47.6 62 46.4" fill="none" stroke="#e2ad98" stroke-width="0.8" stroke-linecap="round"/>
      <!-- Soft cheeks -->
      <ellipse cx="37.4" cy="52.4" rx="4.2" ry="2.6" fill="#ec918a" opacity="0.38"/>
      <ellipse cx="62.6" cy="52.4" rx="4.2" ry="2.6" fill="#ec918a" opacity="0.38"/>
      <!-- A slim nose -->
      <path d="M50 45 Q51.4 50.6 48.8 52.6 Q50 53.4 51.6 52.6" fill="none" stroke="#d9a18a" stroke-width="1.1" stroke-linecap="round"/>
      <!-- Full red lips, a slight closed smile -->
      <path d="M43.4 59.8 Q46.6 57.2 50 58.4 Q53.4 57.2 57 59.4 Q50 60.8 43.4 59.8 Z" fill="#c3424f"/>
      <path d="M43.4 59.8 Q50 60.8 57 59.4 Q54.8 63.8 50.2 63.8 Q45.6 63.8 43.4 59.8 Z" fill="#d65862"/>
      <path d="M43 60 Q50 61.2 57.4 59.2" fill="none" stroke="#9c2f3b" stroke-width="0.9" stroke-linecap="round"/>
      <path d="M47.6 61.8 Q50 62.6 52.4 61.8" fill="none" stroke="#e98a90" stroke-width="0.7" stroke-linecap="round"/>
    </g>
    <!-- Gold collar necklace -->
    <path d="M38.4 77.4 Q50 83.6 61.6 77.4" fill="none" stroke="#d4a54a" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
