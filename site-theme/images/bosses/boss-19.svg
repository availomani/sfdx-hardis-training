      <ellipse cx="57.8" cy="44" rx="2" ry="1.9" fill="#4a3a24"/>
      <circle cx="40.1" cy="43.3" r="0.65" fill="#ffffff"/>
      <circle cx="58.5" cy="43.3" r="0.65" fill="#ffffff"/>
      <path d="M36.4 43.4 Q39.4 41.2 42.4 43.2 M54.8 43.2 Q57.8 41.2 60.8 43.4" fill="none" stroke="#2a1f19" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M37 46.6 Q39.4 47.6 41.8 46.6 M55.4 46.6 Q57.8 47.6 60.2 46.6" fill="none" stroke="#dca78e" stroke-width="0.8" stroke-linecap="round"/>
