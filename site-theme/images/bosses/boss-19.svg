      <path d="M46.8 65.8 L50 65.8 L49.4 68.8 L47.4 68.8 Z" fill="#2a211d"/>
      <path d="M41 69 C43 67.8 46.2 68 48.4 68.6 C50.6 68 53.8 67.8 55.8 69 C56.8 73.2 53.8 77 48.4 78 C43 77 40 73.2 41 69 Z" fill="#2a211d"/>
      <path d="M44.4 71 L45 73.6 M48.4 71.4 L48.4 74.6 M52.4 71 L51.8 73.6" fill="none" stroke="#4a3d36" stroke-width="0.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
