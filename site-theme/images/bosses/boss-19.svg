      <path d="M30 40.2 L46.4 40.2 M50.8 40.2 L67.4 40.2" fill="none" stroke="#1d1d1f" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M46.2 41.8 Q48.6 40.6 51 41.8 M67 40.8 L71 43" fill="none" stroke="#1d1d1f" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Nose -->
      <path d="M47.8 47.4 C47.8 50.6 48.8 52.8 49.8 54.4" fill="none" stroke="#d5a287" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M44.8 54.6 Q44.4 56.2 46.2 56.4 Q48.2 57.2 50.2 56.4 Q52 56.2 51.6 54.6" fill="none" stroke="#c99477" stroke-width="1.1" stroke-linecap="round"/>
      <!-- Curled moustache, thick in the middle, fine tips turned up -->
      <path d="M48.2 56.8 C45 55.8 40.8 56.6 38.2 58.6 C36.8 60 35.4 60 34.6 59 C34.4 58.4 34.6 57.8 35 57.4 C33.6 57.8 33.2 59.2 33.8 60.4 C35 62.2 37.8 62.6 40.4 61.6 C43 60.8 46 60.8 48.2 61.2 C50.4 60.8 53.4 60.8 56 61.6 C58.6 62.4 61.4 62.2 62.6 60.4 C63.2 59.2 62.8 57.8 61.4 57.4 C61.8 57.8 62 58.4 61.8 59 C61 60 59.6 60 58.2 59 C55.6 56.6 51.4 55.8 48.2 56.8 Z" fill="#231c18"/>
      <!-- A slight closed smile -->
      <path d="M43 63 Q48.2 65 53.6 62.8" fill="none" stroke="#9b5b52" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M44.4 63.8 Q48.2 66.2 52.2 63.6 Q48.2 65 44.4 63.8 Z" fill="#d0928a"/>
