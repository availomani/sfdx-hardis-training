<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Boss">
  <!-- A boss of world 9: a man with short dark hair, black rectangular
       glasses, thick dark eyebrows, a curled moustache and a goatee, a slight
       smile, a black and white checked flannel shirt. -->
  <defs>
    <clipPath id="boss19-round">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
    <pattern id="boss19-check" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-6)">
      <path d="M0 0 H7 V7 H0 Z" fill="#f3f3f1"/>
      <path d="M0 0 H3.4 V7 H0 Z" fill="#1c1c1f" opacity="0.62"/>
      <path d="M0 0 H7 V3.4 H0 Z" fill="#1c1c1f" opacity="0.62"/>
    </pattern>
  </defs>
  <g clip-path="url(#boss19-round)">
    <rect width="100" height="100" fill="#ece8b4"/>
    <!-- Neck and the checked flannel shirt -->
    <path d="M41 64 L58 64 L59 84 L40 84 Z" fill="#e8bda3"/>
    <path d="M4 100 C7 88 19 82 36 79 L64 79 C81 82 93 88 96 100 Z" fill="url(#boss19-check)"/>
    <path d="M39.6 74 L35 82 L44 92 L49.6 82.6 Z M59.4 74 L64 82 L55 92 L49.4 82.6 Z" fill="url(#boss19-check)" stroke="#1c1c1f" stroke-width="0.9" stroke-linejoin="round"/>
    <circle cx="49.6" cy="88" r="1.1" fill="#8a8a8a"/>
    <g transform="rotate(-4 50 60)">
