      <path d="M70 44.8 Q72.2 48 69.8 51.8" fill="none" stroke="#cd977d" stroke-width="0.9" stroke-linecap="round"/>
      <!-- A long face, turned a little to the left -->
      <path d="M31 42 C31 27 39 18 50 18 C61 18 68.4 27 68.4 42 C68.4 54 67 61.6 63 67.6 C59.6 72.6 54.6 77 48.6 77 C43.4 77 39.4 73 36.4 68 C32.6 62 31 54 31 42 Z" fill="#f2cfb8"/>
      <!-- Stubble shadow on the cheeks and the jaw -->
      <path d="M32.4 52 C33.4 60 35.6 66 39 70.6 C41.8 74.6 45 77 48.6 77 C53.6 77 57.6 74.6 60.6 70.6 C64 66 66.4 60 67.4 52 C64.6 57 61 59.6 57 60 L41 60 C37 59.6 34.6 57 32.4 52 Z" fill="#8c8580" opacity="0.2"/>
      <!-- Short dark hair, cropped close to the head -->
      <path d="M30.8 44 C29.8 35 30 26 32.6 20.4 C35.6 14 42 11.6 50 11.6 C58 11.6 64.4 14 67.4 20.4 C70 26 70.2 35 69.2 44 C68.6 39.4 67.8 36 66.6 33.4 C66.2 30.4 64.6 27.4 61.4 25.8 C58 24.4 54 24.2 50 24.2 C46 24.2 42 24.4 38.6 25.8 C35.4 27.4 33.8 30.4 33.4 33.4 C32.2 36 31.4 39.4 30.8 44 Z" fill="#332a26" opacity="0.5"/>
      <path d="M30.8 41 C29.8 33 30 25.6 32.6 20.4 C35.6 14 42 11.6 50 11.6 C58 11.6 64.4 14 67.4 20.4 C70 25.6 70.2 33 69.2 41 C68.4 37 67.4 34 66 32 C65.4 28.6 63.8 26 60.8 24.6 C57.6 23 53.8 22.6 50 22.6 C46.2 22.6 42.4 23 39.2 24.6 C36.2 26 34.6 28.6 34 32 C32.6 34 31.6 37 30.8 41 Z" fill="#332a26"/>
      <path d="M38 18.6 C42 16 47 15 52 15.2" fill="none" stroke="#4d423c" stroke-width="1" stroke-linecap="round"/>
