    <!-- Lapels -->
    <path d="M35 77.6 L42.4 96 L40.4 100 L28 100 L25 88 L31 84 Z M65 77.6 L57.6 96 L59.6 100 L72 100 L75 88 L69 84 Z" fill="#2f4475" stroke="#1a2747" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- Ears -->
    <ellipse cx="29.6" cy="48.6" rx="3.4" ry="5.6" fill="#d9a580"/>
    <ellipse cx="70.4" cy="48.6" rx="3.4" ry="5.6" fill="#d9a580"/>
    <path d="M29.6 46 Q27.8 48.6 29.8 51.6 M70.4 46 Q72.2 48.6 70.2 51.6" fill="none" stroke="#bd8862" stroke-width="0.8" stroke-linecap="round"/>
