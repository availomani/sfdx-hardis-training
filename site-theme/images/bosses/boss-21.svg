<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Boss">
  <!-- A boss of world 9: a man with dark brown wavy hair swept up and back,
       short at the sides, thick dark eyebrows, brown eyes, a full trimmed dark
       beard and moustache, a slight smile, a navy blazer over an open white
       shirt. -->
  <defs>
    <clipPath id="boss21-round">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
    <clipPath id="boss21-eyeL">
      <path d="M36.8 45.4 Q40.6 42.6 44.4 45.2 Q40.6 47.6 36.8 45.4 Z"/>
    </clipPath>
    <clipPath id="boss21-eyeR">
      <path d="M55.6 45.2 Q59.4 42.6 63.2 45.4 Q59.4 47.6 55.6 45.2 Z"/>
    </clipPath>
    <linearGradient id="boss21-hair" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="40">
      <stop offset="0" stop-color="#4a3528"/>
      <stop offset="1" stop-color="#2c1f18"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#boss21-round)">
