    <path d="M45.6 29.2 C42.6 29.8 40 31.4 38.8 33.6 C38.2 34.6 38 35.6 38.2 36.4 C39.2 34.8 40.8 33.8 42.4 33.2 C44 32.4 45.2 31 45.6 29.2 Z" fill="#2c1f18"/>
    <path d="M36.4 30 C37.4 24.6 41.2 20.4 46.6 18.6 M44 28.4 C45.8 23.4 50 20.4 55.4 20 M53.4 27.6 C56 23.8 60.4 22 65 22.8 M39.6 15.6 C42.6 13.4 46.4 12.6 50 13.2 M55.6 12.4 C59.8 12.8 63.4 14.8 65.6 18" fill="none" stroke="#6a4d3b" stroke-width="1" stroke-linecap="round"/>
