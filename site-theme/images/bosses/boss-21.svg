    <path d="M41 62.2 C42 59 45.6 57.8 50 59 C54.4 57.8 58 59 59 62.2 C56.2 61.2 53.2 61 50 61.4 C46.8 61 43.8 61.2 41 62.2 Z" fill="#241811"/>
    <!-- A slight closed smile -->
    <path d="M44 62.6 Q50 64.4 56 62.6 Q54.2 65.4 50 65.6 Q45.8 65.4 44 62.6 Z" fill="#b0675c"/>
    <path d="M43.4 62.4 Q50 64.6 56.6 62.4" fill="none" stroke="#5a2e28" stroke-width="0.9" stroke-linecap="round"/>
  </g>
</svg>
