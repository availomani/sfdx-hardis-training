    <path d="M31.4 44 C31.8 50 33.6 54.8 37 57.6 C39.4 59.4 41.6 60 44 59.8 C46 59.4 48 58.6 50 58.8 C52 58.6 54 59.4 56 59.8 C58.4 60 60.6 59.4 63 57.6 C66.4 54.8 68.2 50 68.6 44 C69.4 51 69 58.6 66.4 65.2 C64 71.4 59.8 75.8 55 78 C53.2 79 51.6 79.8 50 80 C48.4 79.8 46.8 79 45 78 C40.2 75.8 36 71.4 33.6 65.2 C31 58.6 30.6 51 31.4 44 Z" fill="#33241b"/>
    <path d="M35.8 61.6 C36.8 66.4 38.8 70.2 41.8 73.4 M64.2 61.6 C63.2 66.4 61.2 70.2 58.2 73.4 M46.8 72.8 C47.6 75 48.8 76.8 50 78 M53.2 72.8 C52.4 75 51.2 76.8 50 78" fill="none" stroke="#4d382b" stroke-width="0.8" stroke-linecap="round"/>
