    <path d="M36.4 45.5 Q40.6 42 44.8 45.1 M55.2 45.1 Q59.4 42 63.6 45.5" fill="none" stroke="#2a1a12" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M37.6 48 Q40.6 49.2 43.6 48 M56.4 48 Q59.4 49.2 62.4 48" fill="none" stroke="#c99472" stroke-width="0.8" stroke-linecap="round"/>
