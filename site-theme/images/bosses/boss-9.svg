    <path d="M50.4 43 C50.8 47 52.2 51 51.8 54" fill="none" stroke="#cf9777" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M47 54.6 Q50 56.6 53 54.6" fill="none" stroke="#c48b6c" stroke-width="1.2" stroke-linecap="round"/>
