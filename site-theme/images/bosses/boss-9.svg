    </clipPath>
    <linearGradient id="boss9-hair" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="29">
      <stop offset="0" stop-color="#9a9ea3"/>
      <stop offset="0.6" stop-color="#868a8f"/>
      <stop offset="1" stop-color="#635d57"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#boss9-round)">
