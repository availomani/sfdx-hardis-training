<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Boss">
  <!-- A boss of world 9: a clean-shaven man with grey hair slicked back, a
       strong jaw, a serious and confident look, a black suit and an open
       white shirt. -->
  <defs>
    <clipPath id="boss9-round">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
    <clipPath id="boss9-eyeL">
      <path d="M36.8 44.6 Q40.6 40.8 44.4 44 Q40.6 46 36.8 44.6 Z"/>
    </clipPath>
    <clipPath id="boss9-eyeR">
