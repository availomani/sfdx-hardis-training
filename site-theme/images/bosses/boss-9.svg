    <path d="M33.4 29.6 C32.6 21.6 37.4 14.6 45.4 12.6 C48.4 11.8 52 11.8 55 12.4 C62 13.6 66.8 18.4 67.2 23.8 C67.4 25.8 67.2 27.6 66.6 29.4 C65.6 27.6 64 26.4 62 25.8 C58 24.6 54 24 50 24 C47.6 24 46.4 24.4 45 24.6 C42.6 24.6 40 25 38 25.8 C36 26.4 34.4 27.8 33.4 29.6 Z" fill="url(#boss9-hair)"/>
    <path d="M38.6 25.6 C39.6 20.6 42.4 16.4 46.6 13.8 M45 24.6 C45.8 20.2 47.8 16.4 51 13.4 M52.6 24 C53.4 19.8 55.4 16.4 58.4 14.4 M59.6 25 C60.6 21.6 62.4 18.8 65 17.2" fill="none" stroke="#6c6f74" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M42 25 C42.8 20.8 45 17 48.6 14.4 M56 24.4 C57 20.8 59 17.8 62 15.8" fill="none" stroke="#adb1b5" stroke-width="0.7" stroke-linecap="round"/>
