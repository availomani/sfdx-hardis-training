    <path d="M40.5 62 L59.5 62 L61 88 L39 88 Z" fill="#e5b493"/>
    <path d="M40.5 64 C45 72 55 72 59.5 64 L59.5 70 C55 76.5 45 76.5 40.5 70 Z" fill="#cf9a7a"/>
