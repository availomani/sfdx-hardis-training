    <path d="M50 17 C61.6 17 68 25 68 38 C68 49 68.2 56 67.2 61.6 C66.2 66 62.4 70.4 57.6 72.6 C55.4 73.8 53 74.4 50 74.4 C47 74.4 44.6 73.8 42.4 72.6 C37.6 70.4 33.8 66 32.8 61.6 C31.8 56 32 49 32 38 C32 25 38.4 17 50 17 Z" fill="#edbe9e"/>
    <path d="M33.4 49.6 C34.8 55.4 37.8 59.4 41.6 61.2 C38.6 57.8 36.6 54 35.8 49 Z M66.6 49.6 C65.2 55.4 62.2 59.4 58.4 61.2 C61.4 57.8 63.4 54 64.2 49 Z" fill="#dca384" opacity="0.4"/>
    <path d="M45.2 56 Q43.2 58.4 43.8 61.2 M54.8 56 Q56.8 58.4 56.2 61.2 M47.2 66.8 Q50 65.8 52.8 66.8" fill="none" stroke="#d8a283" stroke-width="0.9" stroke-linecap="round"/>
