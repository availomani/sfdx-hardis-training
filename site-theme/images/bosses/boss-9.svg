    <path d="M35.2 40 Q40 38.4 46 39.6" fill="none" stroke="#574b44" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M54 39.4 Q60 37.6 64.8 39.4" fill="none" stroke="#574b44" stroke-width="2.3" stroke-linecap="round"/>
    <!-- Narrowed, confident hazel eyes -->
    <path d="M36.8 44.6 Q40.6 40.8 44.4 44 Q40.6 46 36.8 44.6 Z" fill="#ffffff"/>
    <path d="M55.6 44 Q59.4 40.8 63.2 44.6 Q59.4 46 55.6 44 Z" fill="#ffffff"/>
    <g clip-path="url(#boss9-eyeL)">
      <circle cx="40.8" cy="43.7" r="2" fill="#6b5036"/>
      <circle cx="40.8" cy="43.7" r="0.95" fill="#231912"/>
    </g>
    <g clip-path="url(#boss9-eyeR)">
      <circle cx="59.2" cy="43.7" r="2" fill="#6b5036"/>
      <circle cx="59.2" cy="43.7" r="0.95" fill="#231912"/>
    </g>
    <circle cx="41.5" cy="43" r="0.55" fill="#ffffff"/>
    <circle cx="59.9" cy="43" r="0.55" fill="#ffffff"/>
    <path d="M36.4 44.6 Q40.6 40.2 44.8 43.8 M55.2 43.8 Q59.4 40.2 63.6 44.6" fill="none" stroke="#33261f" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M37.8 46.6 Q40.6 47.4 43.4 46.4 M56.6 46.4 Q59.4 47.4 62.2 46.6" fill="none" stroke="#d6a080" stroke-width="0.8" stroke-linecap="round"/>
