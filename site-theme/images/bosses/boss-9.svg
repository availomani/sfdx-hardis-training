    <path d="M59.5 72 L63.5 86 L53.5 91 Z" fill="#ffffff" stroke="#d4d6d9" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M0 100 L0 88 C6 80 20 76 33 75 L45 100 Z" fill="#1c1c21"/>
    <path d="M100 100 L100 88 C94 80 80 76 67 75 L55 100 Z" fill="#1c1c21"/>
    <path d="M33 75 L37 88 L33.5 90 L41 100 M67 75 L63 88 L66.5 90 L59 100" fill="none" stroke="#3b3b44" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Ears -->
    <ellipse cx="31.8" cy="45" rx="3.2" ry="5.8" fill="#e3b190"/>
    <ellipse cx="68.2" cy="45" rx="3.2" ry="5.8" fill="#e3b190"/>
