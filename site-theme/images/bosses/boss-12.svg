<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Boss">
  <!-- A boss of world 9: a woman with long straight blond hair parted in
       the middle, blue eyes, a slight closed smile, a small earring. -->
  <defs>
    <clipPath id="boss12-round">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
    <linearGradient id="boss12-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94744a"/>
      <stop offset="0.45" stop-color="#c29760"/>
      <stop offset="1" stop-color="#dcb57b"/>
    </linearGradient>
    <linearGradient id="boss12-locks" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a07c50"/>
      <stop offset="0.5" stop-color="#cfa66c"/>
      <stop offset="1" stop-color="#e6c48b"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#boss12-round)">
    <rect width="100" height="100" fill="#f6c9e8"/>
    <!-- The long hair behind the head -->
    <path d="M48 8.6 C35 8.6 26.4 16 24.8 30 C23.4 42 23.6 54 20.6 66 C18.4 76 17.6 88 15.6 100 L84.4 100 C82.4 88 81.6 76 79.4 66 C76.6 54 76.8 42 75.4 30 C73.8 16 63 8.6 48 8.6 Z" fill="url(#boss12-hair)"/>
    <!-- Neck and a dark top -->
    <path d="M43 62 L57 62 L58 86 L42 86 Z" fill="#efc5ae"/>
    <path d="M43 62 Q50 70 57 62 L57.4 68 Q50 72.6 42.6 68 Z" fill="#e2b19a"/>
    <path d="M26 100 L30 86 C40 89 60 89 70 86 L74 100 Z" fill="#3a3940"/>
    <!-- The face, an oval with high cheekbones -->
    <path d="M30.6 41 C30.6 27 39.4 20.6 50 20.6 C60.6 20.6 69.4 27 69.4 41 C69.4 52 66.6 60 61.4 64.8 C58.2 67.6 54.4 68.8 50 68.8 C45.6 68.8 41.8 67.6 38.6 64.8 C33.4 60 30.6 52 30.6 41 Z" fill="#f6d5c0"/>
    <!-- The ear left uncovered, a small earring -->
    <ellipse cx="31.2" cy="45.6" rx="3" ry="5.2" fill="#ecbfa6"/>
    <path d="M30.6 43 Q29.6 45.6 30.8 48.4" fill="none" stroke="#d6a088" stroke-width="0.7" stroke-linecap="round"/>
    <circle cx="31.2" cy="51.6" r="1.2" fill="#e8c77c" stroke="#b8933f" stroke-width="0.4"/>
    <!-- Hair in front: a middle parting, one side behind the ear, the
         other falling straight over the cheek -->
    <path d="M46.4 14.2 C39.4 14.8 33.4 20 31.4 30 C30.6 33.8 30.6 37.4 31 40.6 C32.4 34 35.2 27.8 39.8 23.6 C42 21.6 44.4 19.4 46.4 17.4 Z" fill="url(#boss12-locks)"/>
    <path d="M27.6 50 C25.6 60 26 70 23.4 80 C22 88 22.4 94 21 100 L34 100 C32.8 92 33.6 86 32.6 78 C31.6 70 32.2 62 30.8 55 Z" fill="url(#boss12-locks)"/>
    <path d="M46.4 14.2 C58.6 13.8 68.4 20.4 70.4 34 C71.6 42 70.6 50 72.6 58 C74.8 68 73 80 76 92 L78 100 L62 100 C64 90 63 80 65 70 C66.4 62 66.2 54 66.4 46 C66.6 38 65.6 33 63 29 C59.6 24.6 54 22 49.6 21 C48 19.8 47 18.6 46.4 17.4 Z" fill="url(#boss12-locks)"/>
    <g fill="none" stroke="#ead09b" stroke-width="1" stroke-linecap="round">
      <path d="M43.6 16.6 C38.6 19.6 35.2 25 33.6 32"/>
      <path d="M50.4 16.4 C58.6 18.4 65 24 67.6 32 C69 38 68.4 48 69.8 56 C71 64 69.2 74 70.6 84 C71.4 90 70.6 95 71.4 99"/>
      <path d="M73 44 C74.4 54 77 64 75.6 74 C74.8 82 77.4 90 77.8 99"/>
      <path d="M28.8 58 C28 66 28.6 72 26.8 80 C25.8 86 26.4 92 25.6 99"/>
      <path d="M25.4 34 C24.4 44 24.4 54 21.8 64 C20.2 72 19.8 80 19 90"/>
    </g>
    <path d="M62 12.6 C67 13.6 71.6 17.6 74 23 M31.6 14.8 C28.6 17.4 26.6 21 25.8 25" fill="none" stroke="#c9a06a" stroke-width="0.7" stroke-linecap="round"/>
    <!-- Thin arched eyebrows -->
    <path d="M36.4 35.8 Q41 32.8 46.4 34.8 M53.6 34.8 Q59 32.8 63.6 35.8" fill="none" stroke="#97704a" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Blue eyes -->
    <path d="M37.6 42.2 Q42 39 46.2 42 Q42 43.8 37.6 42.2 Z M53.8 42 Q58 39 62.4 42.2 Q58 43.8 53.8 42 Z" fill="#ffffff"/>
    <circle cx="42" cy="41.6" r="2" fill="#6a92bb"/>
    <circle cx="58" cy="41.6" r="2" fill="#6a92bb"/>
    <circle cx="42" cy="41.6" r="0.9" fill="#24303c"/>
    <circle cx="58" cy="41.6" r="0.9" fill="#24303c"/>
    <circle cx="42.6" cy="41" r="0.55" fill="#ffffff"/>
    <circle cx="58.6" cy="41" r="0.55" fill="#ffffff"/>
    <path d="M37.4 42.2 Q42 38.4 46.4 41.8 M53.6 41.8 Q58 38.4 62.6 42.2" fill="none" stroke="#4b3527" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M39 45.2 Q42 46.2 45 45.2 M55 45.2 Q58 46.2 61 45.2" fill="none" stroke="#e4b29c" stroke-width="0.9" stroke-linecap="round"/>
    <!-- Soft cheeks -->
    <ellipse cx="37.4" cy="52" rx="4.4" ry="2.8" fill="#f0a097" opacity="0.32"/>
    <ellipse cx="62.6" cy="52" rx="4.4" ry="2.8" fill="#f0a097" opacity="0.32"/>
    <!-- Nose -->
    <path d="M50.4 42.6 Q51 49 48.6 52.4 Q50.4 54 53 53" fill="none" stroke="#dca58c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- A slight closed smile, full pink lips -->
    <path d="M43.2 59.2 Q47 57.6 50 58.6 Q53 57.6 56.8 59.2 Q53 60.2 50 60.2 Q47 60.2 43.2 59.2 Z" fill="#cf7e82"/>
    <path d="M44 59.6 Q50 64.4 56 59.6 Q50 60.8 44 59.6 Z" fill="#dc9393"/>
    <path d="M42.8 58.8 Q50 61.4 57.2 58.8" fill="none" stroke="#b0616a" stroke-width="1" stroke-linecap="round"/>
    <path d="M42 58 Q42.4 58.6 42.8 58.8 M58 58 Q57.6 58.6 57.2 58.8" fill="none" stroke="#c98a7c" stroke-width="0.8" stroke-linecap="round"/>
  </g>
</svg>
