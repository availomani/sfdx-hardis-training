<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Boss">
  <!-- A woman with long straight black hair, dark brown eyes, a gentle
       smile and a red top. -->
  <defs>
    <clipPath id="boss16-round">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
    <linearGradient id="boss16-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1717"/>
      <stop offset="1" stop-color="#2d2624"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#boss16-round)">
    <rect width="100" height="100" fill="#ffdcae"/>
    <!-- The long hair behind the head -->
    <path d="M50 5 C35 5 25 13 23 28 C21 42 18 56 16 70 C14 82 13 92 12 100 L84 100 C82 94 80 88 79 80 C77 66 77 44 76 30 C74 14 64 5 50 5 Z" fill="url(#boss16-hair)"/>
    <!-- Neck, bare shoulders and the red top -->
    <path d="M43.4 62 L56.6 62 L57 86 L43 86 Z" fill="#ecc8b4"/>
    <path d="M43.4 62 Q50 70 56.6 62 L56.8 68.6 Q50 73 43.2 68.6 Z" fill="#e2b6a2"/>
    <path d="M6 100 C8 90 20 84.4 34 83.4 L66 83.4 C80 84.4 92 90 94 100 Z" fill="#efcfbe"/>
    <path d="M24 100 C25 94 27 88 31 82 L37 82 C39 88 44 91 50 91 C56 91 61 88 63 82 L69 82 C73 88 75 94 76 100 Z" fill="#d42a2f"/>
    <path d="M37 82 C39 88 44 91 50 91 C56 91 61 88 63 82" fill="none" stroke="#b51f25" stroke-width="1.1"/>
    <!-- The face, an oval with a narrow chin -->
    <path d="M31.5 40 C31.5 26 40 19.5 50 19.5 C60 19.5 68.5 26 68.5 40 C68.5 51 65.6 59 60.6 64.6 C57.6 68 54 70 50 70 C46 70 42.4 68 39.4 64.6 C34.4 59 31.5 51 31.5 40 Z" fill="#f4d6c4"/>
    <!-- Hair in front: parted just off the middle, straight curtains over the forehead corners -->
    <path d="M53 8 C42 8 32 14 29 28 C27 40 28 52 27 64 C26 76 22 88 21 100 L34 100 C33 90 31 80 32 70 C33 62 32.4 52 32.4 44 C32.4 38 32.8 34 33.6 31 C36.4 24 42.4 20.6 52 19.6 Z" fill="url(#boss16-hair)"/>
    <path d="M53 8 C63 9 70 16 71 28 C72 40 71 52 72 64 C73 74 76 80 80 86 L70 90 C67.4 82 67.2 74 67.6 66 C68 56 68.4 46 68.2 38 C68 30 66 24.4 62 22 C58.6 20 55.4 19.6 52 19.6 Z" fill="url(#boss16-hair)"/>
    <g fill="none" stroke="#4b4341" stroke-width="1" stroke-linecap="round">
      <path d="M50 10.6 C42 11.6 35.6 16 32.6 24"/>
      <path d="M56 10.6 C62 12.6 66.6 17 68.6 24"/>
      <path d="M29.6 40 C29 52 29.6 62 28.6 72 C28 80 26 88 25.6 96"/>
      <path d="M70 42 C70.2 52 69.6 62 70.4 70 C71 76 73 80 75.6 84"/>
      <path d="M22.6 50 C21.4 62 20.6 72 19.4 84"/>
    </g>
    <!-- Straight dark eyebrows with a soft arch -->
    <path d="M35 35.2 Q39.6 32.6 45.4 34.2" fill="none" stroke="#2c201c" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M54.6 34.2 Q60.4 32.6 65 35.2" fill="none" stroke="#2c201c" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Dark brown eyes, lined -->
    <path d="M35.8 41 Q40.6 37 45.2 40.8 Q40.6 43.4 35.8 41 Z M54.8 40.8 Q59.4 37 64.2 41 Q59.4 43.4 54.8 40.8 Z" fill="#ffffff"/>
    <circle cx="40.6" cy="40.4" r="2.5" fill="#4a2e20"/>
    <circle cx="59.4" cy="40.4" r="2.5" fill="#4a2e20"/>
    <circle cx="40.6" cy="40.4" r="1.05" fill="#160e0a"/>
    <circle cx="59.4" cy="40.4" r="1.05" fill="#160e0a"/>
    <circle cx="41.3" cy="39.7" r="0.6" fill="#ffffff"/>
    <circle cx="60.1" cy="39.7" r="0.6" fill="#ffffff"/>
    <path d="M35.4 41.2 Q40.6 36.4 45.4 40.6 M54.6 40.6 Q59.4 36.4 64.6 41.2" fill="none" stroke="#1a1210" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M36.8 42.2 Q40.6 44.2 44.4 42.4 M55.6 42.4 Q59.4 44.2 63.2 42.2" fill="none" stroke="#4a3129" stroke-width="0.9" stroke-linecap="round"/>
    <!-- Soft cheeks -->
    <ellipse cx="37" cy="50" rx="4.4" ry="2.8" fill="#f1a39a" opacity="0.22"/>
    <ellipse cx="63" cy="50" rx="4.4" ry="2.8" fill="#f1a39a" opacity="0.22"/>
    <!-- Nose -->
    <path d="M50.4 42.5 Q51 48 49.2 50.6 Q50.6 52 52.6 51" fill="none" stroke="#ddab96" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- A gentle closed smile -->
    <path d="M42 55.9 Q46 54.2 50 55.2 Q54 54 58.2 55.4 Q50 57.8 42 55.9 Z" fill="#cf8791"/>
    <path d="M42.4 56.4 Q50 59.2 57.8 56 Q52 63 42.4 56.4 Z" fill="#dc98a0"/>
    <path d="M41.8 55.8 Q50 58.6 58.4 55.4" fill="none" stroke="#b9636c" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M40.4 54.4 Q39.2 55.8 40.2 57.4 M59.8 54 Q61 55.4 60 57" fill="none" stroke="#e5b8a8" stroke-width="0.8" stroke-linecap="round"/>
  </g>
</svg>
