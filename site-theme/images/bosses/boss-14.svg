      <path d="M44 13.8 C46 12 48.6 11 51.4 10.8 M57 14.6 C60 13.4 62.6 13.6 64.6 15 M38.6 18.6 C39.6 17 41 16 42.6 15.4 M48 21.6 C49 20 50.4 19 52.2 18.4" stroke="#c4c3c0" stroke-width="0.8"/>
