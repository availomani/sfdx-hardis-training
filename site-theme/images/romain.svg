    <path d="M37 45.6 Q41 41.8 45 45.2 Q41 46.6 37 45.6 Z M55 45.2 Q59 41.8 63 45.6 Q59 46.6 55 45.2 Z" fill="#ffffff"/>
    <circle cx="41" cy="44.6" r="2.1" fill="#6a4329"/>
    <circle cx="59" cy="44.6" r="2.1" fill="#6a4329"/>
    <circle cx="41" cy="44.6" r="1" fill="#221610"/>
    <circle cx="59" cy="44.6" r="1" fill="#221610"/>
    <circle cx="41.7" cy="43.9" r="0.6" fill="#ffffff"/>
    <circle cx="59.7" cy="43.9" r="0.6" fill="#ffffff"/>
    <path d="M36.6 45.6 Q41 41.2 45.4 45 M54.6 45 Q59 41.2 63.4 45.6" fill="none" stroke="#2f221b" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M37.8 47.4 Q41 48.8 44.2 47.2 M55.8 47.2 Q59 48.8 62.2 47.4" fill="none" stroke="#d49c7d" stroke-width="0.9" stroke-linecap="round"/>
