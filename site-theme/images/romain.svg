    <path d="M41 62.2 C43.6 59 47.6 58.4 50 59.4 C52.4 58.4 56.4 59 59 62.2 C55.4 61 52.6 61 50 61.6 C47.4 61 44.6 61 41 62.2 Z" fill="#4a423d" opacity="0.9"/>
    <!-- A friendly smile -->
    <path d="M41.4 62.2 Q50 66.4 58.6 62.2 Q55 67.8 50 67.8 Q45 67.8 41.4 62.2 Z" fill="#a8605d"/>
    <path d="M43.2 63.1 Q50 66.1 56.8 63.1 L56.1 64.5 Q50 66.8 43.9 64.5 Z" fill="#f7f2ec"/>
    <path d="M41.4 62.2 Q50 66.4 58.6 62.2" fill="none" stroke="#86484a" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M40.6 61 Q40 62.2 40.8 63.4 M59.4 61 Q60 62.2 59.2 63.4" fill="none" stroke="#5a514b" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
