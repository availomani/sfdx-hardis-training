<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Romain">
  <!-- Romain Panda, a teammate of Guinea Run, as a cartoon for his chat
       bubbles: short dark hair going grey, thick dark eyebrows, warm brown
       eyes, a short salt-and-pepper beard and moustache, a friendly smile,
       a black turtleneck. -->
  <defs>
    <clipPath id="romain-round">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>
  <g clip-path="url(#romain-round)">
    <rect width="100" height="100" fill="#d3f0ec"/>
    <!-- The black turtleneck and its loose rolled collar -->
    <path d="M2 100 C4 86 18 80 35 78 L65 78 C82 80 96 86 98 100 Z" fill="#1d1d21"/>
    <path d="M36.6 68 C44 72 56 72 63.4 68 L65.4 84 C56 88.6 44 88.6 34.6 84 Z" fill="#26262b"/>
    <path d="M36 76.4 C41 79.6 46 78.4 50 80 C54 78.4 59 79.6 64 76.4 M35.6 81.4 C42 84.4 47 83 50 84.6 C53 83 58 84.4 64.4 81.4" fill="none" stroke="#3b3b42" stroke-width="1" stroke-linecap="round"/>
    <!-- Ears -->
    <ellipse cx="29.4" cy="48" rx="3.4" ry="6" fill="#e3ae8e"/>
    <ellipse cx="70.6" cy="48" rx="3.4" ry="6" fill="#e3ae8e"/>
    <path d="M28.6 45 Q27.4 48 28.8 51.4 M71.4 45 Q72.6 48 71.2 51.4" fill="none" stroke="#c98d6e" stroke-width="0.8" stroke-linecap="round"/>
    <!-- The face, a long oval with broad cheekbones -->
    <path d="M50 17 C63 17 70 25 70 40 C70 52 69 61 65 67 C61 73 55.4 76.6 50 76.6 C44.6 76.6 39 73 35 67 C31 61 30 52 30 40 C30 25 37 17 50 17 Z" fill="#eebf9f"/>
    <!-- The short salt-and-pepper beard, skin showing through -->
    <path d="M30.4 43 C30.6 54 32 62 36 68 C40 74 45 77.8 50 77.8 C55 77.8 60 74 64 68 C68 62 69.4 54 69.6 43 L67.8 43 C67.4 49 66 54 62.8 56.4 C59.4 55.6 55 55.2 50 55.8 C45 55.2 40.6 55.6 37.2 56.4 C34 54 32.6 49 32.2 43 Z" fill="#6b625c" opacity="0.62"/>
    <g fill="none" stroke="#bab4ae" stroke-width="0.8" stroke-linecap="round" opacity="0.9">
      <path d="M44.6 70.6 l0.6 1.6 M48 72.6 l0.2 1.6 M51.6 72.6 l-0.2 1.6 M55 70.6 l-0.6 1.6"/>
      <path d="M46.6 75 l0.4 1 M50 75.6 l0 1 M53.4 75 l-0.4 1"/>
      <path d="M38 64.6 l1 1.2 M62 64.6 l-1 1.2 M35.2 59.6 l0.8 1.4 M64.8 59.6 l-0.8 1.4"/>
    </g>
