    <path d="M30 43 C28.6 34 29 27 31.6 22 C31.8 18.6 34 16 37.2 15.4 C38.4 12.6 41.4 11 44.4 11.6 C46.4 9.6 49.8 9 52.4 10.2 C55 9.2 58.4 10 60.2 12.2 C63.4 12.4 66.2 14.6 67.2 17.6 C69.8 19.4 70.8 23 70.4 26 C71.4 31.4 71.2 37 70 43 L68.4 43 C68 37 67.2 32.6 65.4 29.8 C64.2 27.8 62.8 26.2 61 25.4 C58.6 25.8 56.4 25.2 54.4 24.4 C52.8 25 51.2 25 50 24.4 C48.8 25 47.2 25 45.6 24.4 C43.6 25.2 41.4 25.8 39 25.4 C37.2 26.2 35.8 27.8 34.6 29.8 C32.8 32.6 32 37 31.6 43 Z" fill="#433b36"/>
    <path d="M30.4 30 C29.8 35 30.2 40 31.6 43 L30 43 C29 39 29 34 30.4 30 Z M69.6 30 C70.2 35 69.8 40 68.4 43 L70 43 C71 39 71 34 69.6 30 Z" fill="#a39e99"/>
    <path d="M31.2 25 C32.8 27 33.6 30 33.4 33 C32.6 30.6 31.6 28.6 30.6 27.6 Z M68.8 25 C67.2 27 66.4 30 66.6 33 C67.4 30.6 68.4 28.6 69.4 27.6 Z" fill="#8a847e" opacity="0.8"/>
    <g fill="none" stroke="#938d87" stroke-width="0.7" stroke-linecap="round" opacity="0.85">
      <path d="M35.4 20.4 q1.6 -1.8 3.6 -2 M43 15.4 q1.8 -1.4 3.8 -1.2 M51.6 13.4 q2 -0.8 3.8 0 M59.6 16 q1.8 0 3.2 1.2 M65.2 21 q1.2 0.6 2 2"/>
      <path d="M39.6 22.8 q1.2 -1 2.6 -1.2 M47.6 20.2 q1.4 -0.8 2.8 -0.6 M55.2 21 q1.4 0 2.6 0.8 M62 23.6 q1 0.4 1.6 1.4"/>
    </g>
