    <path d="M50.6 44.4 C51 48.6 52.6 52 52.2 55" fill="none" stroke="#d29878" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M46.4 55.2 Q50 57.8 53.8 55.2" fill="none" stroke="#c48a6a" stroke-width="1.3" stroke-linecap="round"/>
