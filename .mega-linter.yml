# Extend from shared sfdx-hardis Mega-Linter configuration :)
EXTENDS:
  - https://raw.githubusercontent.com/hardisgroupcom/sfdx-hardis/main/config/sfdx-hardis.mega-linter-config.yml

# Generated files. scripts/build/universe.mjs writes them from
# training-universe.json and the lab front matter, and CI fails when they drift
# from what it produces. A formatter rewriting them would make that check fail
# forever, for a difference nobody made.
FILTER_REGEX_EXCLUDE: (\.vscode|staticresources/|^BACKLOG\.md$|^training-manifest\.json$|^labs/link-map\.[a-z]{2}(-[A-Z]{2})?\.md$|^mkdocs-nav\.yml$|^site-src/|^megalinter-reports/)

# jscpd's minTokens is raised to 120 in .jscpd.json. That file is schema
# validated and rejects a comment key, so the reason lives here: every script in
# this repository opens with the same preamble (the ESM imports, fileURLToPath,
# HERE and ROOT), and at the default of 50 tokens that preamble was the only
# thing the detector ever found.

# The only CSS here styles the documentation site on top of the theme Zensical
# ships, so every selector and custom property it touches is the theme's, not
# ours: stylelint asks us to rename things we do not own.
DISABLE_LINTERS:
  - CSS_STYLELINT
  # checkov and grype take minutes on every Pull Request of the course, a
  # learner's included, and find nothing to say about a training project: there
  # is no infrastructure code for checkov, and trivy already scans dependencies.
  - REPOSITORY_CHECKOV
  - REPOSITORY_GRYPE

# The shared sfdx-hardis configuration reports Apex findings without failing the
# check. Here they fail it, as on any real project: Lab 2.5 teaches that a query
# in a loop does not reach integration. The threshold is MegaLinter's own,
# Moderate and above, and the Helios code and the samples a lab copies carry no
# such finding, so only what a learner writes can turn it red.
SALESFORCE_CODE_ANALYZER_APEX_DISABLE_ERRORS: false

# trivy downloads its vulnerability database on every run, and when the
# download is refused it fails the whole check of a Pull Request that changed
# nothing it scans. It still runs and reports; it no longer blocks a merge on a
# network error.
DISABLE_ERRORS_LINTERS:
  - REPOSITORY_TRIVY
