# The configuration of this course site. It is not named mkdocs.yml on purpose: the repository is
# also the Helios Salesforce project, and Lab 3.9 generates the project documentation, whose
# mkdocs.yml is the project's own. Build with: python -m zensical build -f course-site.yml
site_name: Salesforce DevOps with sfdx-hardis
site_description: Free hands-on Salesforce DevOps training in three levels, from your first Pull Request to owning the CI/CD pipeline, with sfdx-hardis and VS Code
site_url: https://hardisgroupcom.github.io/sfdx-hardis-training/
repo_url: https://github.com/hardisgroupcom/sfdx-hardis-training
repo_name: hardisgroupcom/sfdx-hardis-training
edit_uri: edit/main/labs/
copyright: Cloudity and friends

# The site is assembled by scripts/build/site.mjs, which copies labs/<locale>/,
# the assets, the backlog and the badge pages into site-src/. The source of
# truth stays plain markdown under labs/.
docs_dir: site-src

# Theme, palette, fonts and extensions follow the product documentation site
# (https://sfdx-hardis.cloudity.com), so the course reads as part of the same
# product. The one deliberate difference is the lead colour: the product leads
# with Cloudity blue and accents in purple, the course swaps them. Details and
# the self-hosted fonts live in site-theme/stylesheets/extra.css, which
# scripts/build/site.mjs copies to site-src/theme/.
theme:
  name: material
  # Holds the Giscus comment widget every page ends with, the banner that says
  # the course is in QA and asks for comments, and the four partials that keep
  # each language to itself: the menu, the header logo, the translate widget and
  # the previous and next arrows. Delete main.html when the course is released,
  # and keep the folder and custom_dir: everything else in it outlives the QA.
  custom_dir: site-overrides
  language: en
  font: false
  features:
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.tracking
    # navigation.sections is deliberately absent. It renders the levels as three
    # headings with their labs always under them, which is thirty entries in the
    # menu and the lab being read lost among them. Without it a level is a
    # folder, closed until the reader opens it, and the level holding the page
    # opens by itself. A reader lands on a menu of three or four lines.
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
  logo: theme/images/cloudity-text-logo-white.svg
  # The level 3 hexagon with the Cloudity mark inside it, generated from the
  # colours of badge-svg.mjs by scripts/badges/social.mjs, so the icon follows
  # the badges the day the ramp changes. A favicon is 16px: nothing else of the
  # badge survives, and the gold rim is what keeps it visible on a white tab
  # strip and on a dark one.
  favicon: theme/images/badge-mark.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      # background, foreground and colors mirror the product site's palette entries.
      # Zensical 0.0.57 accepts them and emits nothing from them, on both sites: the
      # stylesheet is what paints the page. They stay so the two configs read alike.
      background: "#FFFFFF"
      foreground: "#001135"
      colors:
        primary: "#660FF2"
        accent: "#0053FF"
        link: "#660FF2"
        header: "#660FF2"
        nav: "#FFFFFF"
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      background: "#0A0620"
      foreground: "#FFFFFF"
      colors:
        primary: "#A87BFF"
        accent: "#4D8BFF"
        link: "#A87BFF"
        header: "#1B0A3F"
        nav: "#160C30"

plugins:
  - glightbox
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: site-src
      restrict_base_path: false
  - mdx_truly_sane_lists
  - toc:
      permalink: true

extra_css:
  - theme/stylesheets/extra.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/tablesort/5.2.1/tablesort.min.js
  - theme/javascripts/tables.js
  # The theme wraps every picture in a glightbox link but ships no viewer with
  # it, so a click used to leave the lab and land on a bare PNG. This opens it
  # over the page instead. See site-theme/javascripts/lightbox.js.
  - theme/javascripts/lightbox.js
  # A guard: the template puts nothing after the footer, so anything found
  # there came from a page swap that went wrong. See after-footer.js.
  - theme/javascripts/after-footer.js
  # The theme swaps pages without reloading and leaves the header alone, so the
  # translate widget kept the links of the page the reader landed on. This
  # rebuilds them on every page change. See language-switch.js.
  - theme/javascripts/language-switch.js

extra:
  # Google Analytics, on the course's own data stream inside the sfdx-hardis
  # property, so the course and the product documentation can be read together
  # or apart. The theme emits the tag, sends the page view of the page the
  # reader lands on, and sends one more on every instant navigation.
  #
  # Do not move this into extra_javascript as a hand written gtag.js. The
  # product site did that and lost the first page view of every session: such a
  # script only subscribes to location$, which is a plain Subject and stays
  # silent for the page that is already open.
  #
  # Check it with: node scripts/verify/check-analytics.mjs
  analytics:
    provider: google
    # The course data stream. The product documentation is the other stream of the
    # same property, so the two can be read together or apart.
    property: G-SE20CZ58E1

  # The language selector in the header. It is how a reader changes language,
  # because the menu only ever shows one: site-overrides/partials/alternate.html
  # sends it to the same page in the other language, and falls back to the link
  # below for a page that has no counterpart. Each entry holds the home page of
  # its language, and English is first because it is the reference: every other
  # locale is a translation of labs/en/.
  #
  # It is deliberately NOT called "alternate", which is the name the theme reads.
  # Under that name the theme emits <link rel="alternate"> in the head, and its
  # own language machinery then treats each of those links as the root of a
  # separate site: it asks for <root>/sitemap.xml, and it takes over every click
  # into that root. Here the languages are folders of one site, /fr/sitemap.xml
  # does not exist, and the lookup that follows finds nothing, so a click on
  # Français from Lab 2.2 landed on the French home page whatever the link said.
  # Renaming the key is what leaves the click alone. Checked by
  # scripts/verify/check-nav.mjs, which fails if a rel=alternate link comes back,
  # and by scripts/verify/check-language-switch.mjs, which clicks the widget.
  #
  # The flag is what the picker shows, in the header and in its list, because a
  # flag is read without reading. They are two plain SVG files of the theme, not
  # emoji: Windows ships no flag glyphs and renders them as the two letters of
  # the country code.
  languages:
    - name: English
      link: /sfdx-hardis-training/
      lang: en
      flag: theme/images/flags/gb.svg
    - name: Français
      link: /sfdx-hardis-training/fr/
      lang: fr
      flag: theme/images/flags/fr.svg
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hardisgroupcom/sfdx-hardis
      name: sfdx-hardis on GitHub
    - icon: fontawesome/solid/book
      link: https://sfdx-hardis.cloudity.com/
      name: sfdx-hardis documentation
  generator: false

nav:
  # One flat course per language, English first: it is the reference, and its
  # home page is the home page of the site. A reader only ever sees one of
  # them, because site-overrides/partials/nav.html keeps the entries whose
  # language is the language of the page being read, which every page declares
  # in its front matter. Changing language is the translate widget in the
  # header, which lands on the same page in the other language.
  #
  # Lab entries carry no title on purpose: an entry without one takes the
  # page's own heading, so there is one source of truth and nothing to keep in
  # step by hand. Six of these had drifted from their pages before that rule.
  #
  # mkdocs-nav.yml, generated by scripts/build/universe.mjs, holds the same
  # tree with the titles filled in, which is the file to read when a locale is
  # added or a lab renamed.
  #
  # The backlog and the badges are generated per language, so each course block
  # ends with its own. The one entry in no language is the link to the
  # sfdx-hardis documentation: another site, written once, in English.
  - Home: index.md
  - "Level 1 - Contributor basics":
      - Start here: en/level-1-contributor-basics/index.md
      - en/level-1-contributor-basics/1-1-install-vs-code-and-sfdx-hardis.md
