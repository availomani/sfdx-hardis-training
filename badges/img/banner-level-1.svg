    <rect x="0" y="52" width="320" height="54" fill="#060214" opacity="0.45"/>
    <rect x="0" y="226" width="320" height="64" fill="#0053FF"/>

    <text x="160" y="89" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="29" font-weight="700" fill="#FFFFFF">sfdx-hardis</text>
    <text x="160" y="274" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="56" font-weight="700" letter-spacing="2" fill="#FFFFFF">C1</text>
  </g>

