  <text x="160" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" fill="#101935">sfdx-hardis</text>
  <text x="160" y="119" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="10" letter-spacing="2.5" fill="#5a6782">SALESFORCE DEVOPS</text>

  <rect x="118" y="130" width="84" height="22" rx="11" fill="{{HUE}}"/>
  <text x="160" y="146" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="12" font-weight="700" letter-spacing="1.5" fill="#ffffff">LEVEL {{LEVEL}}</text>
  <text x="160" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="{{NAME_SIZE}}" font-weight="700" fill="#101935">{{SHORT_NAME}}</text>

  <line x1="84" y1="190" x2="236" y2="190" stroke="{{HUE}}" stroke-width="2" opacity="0.4"/>

  <text x="160" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="{{FULLNAME_SIZE}}" font-weight="700" fill="#101935">{{FULLNAME}}</text>
  <text x="160" y="235" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="11" fill="#5a6782">GitHub @{{HANDLE}}</text>
  <text x="160" y="251" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="11" fill="#5a6782">{{TRAILBLAZER_LINE}}</text>
  <text x="160" y="270" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="11" fill="#8b96ac">{{DATE}}</text>

  <text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="600"
        letter-spacing="1.5" fill="#ffffff" opacity="0.85">
    <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">BADGE, NOT A CERTIFICATION - CLOUDITY</textPath>
  </text>
</svg>
