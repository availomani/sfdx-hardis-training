<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="{{NAME}} - {{FULLNAME}}">
  <title>{{NAME}} - {{FULLNAME}} (@{{HANDLE}})</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="{{HUE}}"/>
      <stop offset="100%" stop-color="#101935"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f9"/>
    </linearGradient>
    <path id="bottom-arc" d="M 19 160 A 141 141 0 0 0 301 160"/>
  </defs>

  <circle cx="160" cy="160" r="152" fill="url(#ring)"/>
  <circle cx="160" cy="160" r="124" fill="url(#face)"/>
  <circle cx="160" cy="160" r="124" fill="none" stroke="{{HUE}}" stroke-width="3" opacity="0.5"/>

  <!-- Cloudity logo, from site-theme/images/cloudity-logo.svg -->
  <svg x="128" y="46" width="64" height="31.3" viewBox="0 0 112.4 54.9">
    <path fill="#000094" d="M37.34,39.85l-.32.23c-2.67,2.01-5.86,3.1-9.21,3.15-.08,0-.15,0-.23,0-8.14,0-15-6.28-15.67-14.39-.37-4.45,1.09-8.7,4.1-11.97.67-.73,1.41-1.39,2.21-1.98.79-.59,1.64-1.1,2.53-1.52s1.81-.77,2.76-1.02c.29-.08,1.27-.3,2.22-.49-.04-.08-6.64-7.4-6.79-7.59-.05-.06-.26.08-.26.07C8.68,8.18,2.04,18.16,2.78,29.2c.84,12.63,11.42,22.8,24.08,23.15,5.67.16,11.09-1.55,15.6-4.94l.21-.15c2.61-1.88,7.72-5.14,10.96-6.54-.21-.23-6.52-6.57-6.63-6.73-4.21,1.92-7.38,4.21-9.67,5.86Z"/>
    <path fill="#0053ff" d="M109.63,26.08c-.74-13.15-11.63-23.42-24.81-23.42h-.1c-5.39.02-10.51,1.73-14.78,4.95l-.21.15c-4.08,2.93-8.7,6.26-13.29,6.26-3.06,0-6.92-1.7-11.52-5.09l-2.71-1.77-1.54-.93c-1.58-.86-3.18-1.71-4.86-2.36-1.74-.67-3.46-1.06-5.37-1.21-1.91-.15-3.57-.18-5.5.06.06.18.29.35.42.49.25.27.5.54.76.81.69.74,1.38,1.47,2.07,2.21,1.15,1.23,11.2,11.02,13.12,13.1,1.53,1.65,3.07,3.31,4.59,5,5,5.53,9.9,11.1,15.29,16.25,4.97,4.75,10.43,9.54,17.33,11.13,8.75,2.01,18.17-.57,24.37-7.13,4.75-5.02,7.14-11.59,6.75-18.49ZM100.48,28.9c-.69,8.09-7.55,14.34-15.67,14.34-.09,0-.17,0-.26,0-11.46,0-27.1-20.38-26.9-20.39,7.25-.22,12.6-4.2,17.41-7.67l.32-.23c2.74-2.06,6-3.15,9.44-3.15,4.38,0,8.6,1.86,11.58,5.1,3.01,3.28,4.46,7.55,4.08,12Z"/>
